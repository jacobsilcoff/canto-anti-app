services:
  - type: web
    name: cantonese-learn
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false          # set this in the Render dashboard
      - key: DB_PATH
        value: /var/data/cards.db
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1              # $1/month — keeps your flashcards across deploys
