<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f5f4ef">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Reset password</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
    .login-card {
      background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
      box-shadow:var(--shadow); padding:32px 28px; width:100%; max-width:360px;
      display:flex; flex-direction:column; gap:16px;
    }
    .login-card h2 { font-size:1.3rem; font-weight:700; color:var(--text); text-align:center; }
    .login-card input {
      width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px;
      font-size:1rem; font-family:inherit; color:var(--text); outline:none; box-sizing:border-box;
    }
    .login-card input:focus { border-color:var(--primary); }
    .login-error { color:var(--again); font-size:0.87rem; text-align:center; display:none; }
    .login-footer { font-size:0.83rem; text-align:center; color:var(--text-muted); }
    .login-footer a { color:var(--primary); text-decoration:none; }
  </style>
</head>
<body>
<header>
  <h1>{{APP_NAME_HTML}}</h1>
</header>
<div class="login-wrap">
  <form class="login-card" onsubmit="doReset(event)" id="reset-form">
    <h2>Choose a new password</h2>
    <input type="password" id="pw" placeholder="New password (min 8 characters)" autocomplete="new-password" autofocus>
    <input type="password" id="pw2" placeholder="Confirm password" autocomplete="new-password">
    <button class="translate-btn" type="submit" id="reset-btn">Set new password</button>
    <div class="login-error" id="reset-error"></div>
    <div class="login-footer"><a href="/login">Back to sign in</a></div>
  </form>
</div>
<script>
  const token = new URLSearchParams(location.search).get('token') || '';
  if (!token) {
    document.getElementById('reset-form').innerHTML =
      '<p style="text-align:center;color:var(--again)">Invalid or expired reset link. '
      + '<a href="/forgot-password" style="color:var(--primary)">Request a new one</a>.</p>';
  }

  async function doReset(e) {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const pw2 = document.getElementById('pw2').value;
    const btn = document.getElementById('reset-btn');
    const err = document.getElementById('reset-error');
    err.style.display = 'none';
    if (pw.length < 8) { err.textContent = 'Password must be at least 8 characters.'; err.style.display = 'block'; return; }
    if (pw !== pw2) { err.textContent = 'Passwords do not match.'; err.style.display = 'block'; return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pw }),
      });
      if (res.ok) {
        window.location.replace('/login?reset=1');
      } else {
        const body = await res.json().catch(() => ({}));
        err.textContent = body.detail || 'Link expired or invalid. Request a new one.';
        err.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Set new password';
      }
    } catch {
      err.textContent = 'Network error — please try again.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Set new password';
    }
  }
</script>
</body>
</html>
