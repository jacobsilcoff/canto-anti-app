<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粵語學習 — Flashcards</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>

<header>
  <h1>粵語學習</h1>
  <nav style="display:flex;gap:8px;align-items:center">
    <button class="nav-link" onclick="showBrowse()" style="border:none;cursor:pointer;background:none">
      📚 Browse
    </button>
    <a href="/" class="nav-link">✏️ Translate</a>
  </nav>
</header>

<!-- Loading state -->
<div class="cards-page" id="state-loading">
  <div class="empty-state">
    <div class="icon">⏳</div>
    <h2>Loading…</h2>
  </div>
</div>

<!-- No cards in DB at all -->
<div class="cards-page" id="state-empty" style="display:none">
  <div class="empty-state">
    <div class="icon">📚</div>
    <h2>No flashcards yet</h2>
    <p>Translate some phrases to build your deck.</p>
    <a href="/" class="cta-btn">Go Translate</a>
  </div>
</div>

<!-- Cards exist but none due -->
<div class="cards-page" id="state-caughtup" style="display:none">
  <div class="empty-state">
    <div class="icon">🎉</div>
    <h2>All caught up!</h2>
    <p>No cards due right now.</p>
    <button class="cta-btn" onclick="loadSession('all')">Practice Anyway</button>
  </div>
</div>

<!-- Session complete -->
<div class="cards-page" id="state-done" style="display:none">
  <div class="empty-state">
    <div class="icon">✅</div>
    <h2>Session complete!</h2>
    <p id="done-msg"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px">
      <a href="/" class="cta-btn">Translate More</a>
      <button class="cta-btn secondary" onclick="loadSession('all')">Practice More</button>
    </div>
  </div>
</div>

<!-- Active review -->
<div class="cards-page" id="state-review" style="display:none">
  <div class="session-progress">
    <span id="progress-label"></span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div class="card-wrap">
    <div class="flashcard" id="flashcard">
      <div class="card-prompt-label" id="prompt-label"></div>
      <div class="card-prompt-text" id="prompt-text"></div>
      <div class="card-answer" id="card-answer" style="display:none"></div>
    </div>

    <!-- Before reveal -->
    <div id="pre-reveal">
      <button class="reveal-btn" onclick="revealCard()">Show Answer</button>
      <p class="rating-hint">Space / Enter to reveal</p>
    </div>

    <!-- After reveal -->
    <div id="post-reveal" style="display:none">
      <div class="rating-btns">
        <button class="rating-btn again" onclick="rate('again')">
          Again <span class="key-hint">[ 1 ]</span>
        </button>
        <button class="rating-btn hard" onclick="rate('hard')">
          Hard <span class="key-hint">[ 2 ]</span>
        </button>
        <button class="rating-btn good" onclick="rate('good')">
          Good <span class="key-hint">[ 3 ]</span>
        </button>
        <button class="rating-btn easy" onclick="rate('easy')">
          Easy <span class="key-hint">[ 4 ]</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Browse modal -->
<div class="modal-overlay" id="browse-overlay" style="display:none" onclick="closeBrowse(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 style="font-size:1.1rem">All Cards (<span id="card-count">0</span>)</h2>
      <button class="modal-close" onclick="closeBrowse()">✕</button>
    </div>
    <div id="card-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  let queue = [];
  let total = 0;
  let idx = 0;
  let revealed = false;
  let currentAudio = null;

  // ── Boot ─────────────────────────────────────────────────────────────────
  async function loadSession(mode = 'due') {
    show('loading');
    try {
      const url = mode === 'all' ? '/api/cards/all-faces' : '/api/cards/due';
      const { cards } = await fetch(url).then(r => r.json());

      if (cards.length === 0) {
        if (mode === 'due') {
          // Check if any cards exist at all
          const { cards: all } = await fetch('/api/cards/all-faces').then(r => r.json());
          show(all.length === 0 ? 'empty' : 'caughtup');
        } else {
          show('empty');
        }
        return;
      }

      queue = shuffle(cards);
      total = queue.length;
      idx = 0;
      show('review');
      showCard();
    } catch {
      showToast('Failed to load cards.');
      show('empty');
    }
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ── Show / hide states ───────────────────────────────────────────────────
  function show(state) {
    ['loading', 'empty', 'caughtup', 'done', 'review'].forEach(s =>
      document.getElementById(`state-${s}`).style.display = s === state ? '' : 'none'
    );
  }

  // ── Render card ──────────────────────────────────────────────────────────
  function showCard() {
    if (idx >= queue.length) {
      finishSession();
      return;
    }

    const item = queue[idx];
    revealed = false;

    stopAudio();
    document.getElementById('card-answer').style.display = 'none';
    document.getElementById('pre-reveal').style.display = '';
    document.getElementById('post-reveal').style.display = 'none';

    const done = idx;
    document.getElementById('progress-label').textContent = `${done} / ${total}`;
    document.getElementById('progress-fill').style.width = `${(done / total) * 100}%`;

    const promptEl = document.getElementById('prompt-text');
    promptEl.className = 'card-prompt-text';
    promptEl.innerHTML = '';

    const labelMap = { english: 'English', chinese: 'Chinese', cantonese: 'Cantonese' };
    document.getElementById('prompt-label').textContent = labelMap[item.face];

    if (item.face === 'english') {
      promptEl.classList.add('is-english');
      promptEl.textContent = item.english;
    } else if (item.face === 'chinese') {
      promptEl.classList.add('is-chinese');
      promptEl.textContent = item.chinese;
    } else {
      promptEl.classList.add('is-cantonese');
      const audioBtn = document.createElement('button');
      audioBtn.className = 'audio-btn';
      audioBtn.innerHTML = '🔊 Play';
      audioBtn.onclick = () => playCardAudio(item.card_id, audioBtn);
      const jyEl = document.createElement('div');
      jyEl.className = 'jyutping-display';
      jyEl.textContent = item.jyutping;
      promptEl.appendChild(audioBtn);
      promptEl.appendChild(jyEl);
    }
  }

  // ── Reveal ───────────────────────────────────────────────────────────────
  function revealCard() {
    if (revealed) return;
    revealed = true;

    const item = queue[idx];
    const answerEl = document.getElementById('card-answer');
    answerEl.innerHTML = '';

    const FACES = ['english', 'chinese', 'cantonese'];
    FACES.filter(f => f !== item.face).forEach(face => {
      const row = document.createElement('div');
      row.className = 'answer-row';

      const label = document.createElement('div');
      label.className = 'answer-label';

      if (face === 'english') {
        label.textContent = 'English';
        const val = document.createElement('div');
        val.className = 'answer-value';
        val.textContent = item.english;
        row.appendChild(label);
        row.appendChild(val);
      } else if (face === 'chinese') {
        label.textContent = 'Chinese';
        const val = document.createElement('div');
        val.className = 'answer-value chinese';
        val.textContent = item.chinese;
        row.appendChild(label);
        row.appendChild(val);
      } else {
        label.textContent = 'Cantonese';
        const jyEl = document.createElement('div');
        jyEl.className = 'answer-value jyutping';
        jyEl.textContent = item.jyutping;
        const audioBtn = document.createElement('button');
        audioBtn.className = 'audio-btn';
        audioBtn.style.marginTop = '6px';
        audioBtn.innerHTML = '🔊 Play';
        audioBtn.onclick = () => playCardAudio(item.card_id, audioBtn);
        row.appendChild(label);
        row.appendChild(jyEl);
        row.appendChild(audioBtn);
      }

      answerEl.appendChild(row);
    });

    answerEl.style.display = 'flex';
    document.getElementById('pre-reveal').style.display = 'none';
    document.getElementById('post-reveal').style.display = '';

    if (item.face !== 'cantonese') {
      const dummyBtn = { classList: { add: () => {}, remove: () => {} } };
      setTimeout(() => playCardAudio(item.card_id, dummyBtn), 300);
    }
  }

  // ── Rate ─────────────────────────────────────────────────────────────────
  async function rate(quality) {
    const item = queue[idx];
    try {
      await fetch(`/api/cards/${item.card_id}/review`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ quality, face: item.face }),
      });
    } catch {
      showToast('Failed to save rating — continuing anyway.');
    }
    idx++;
    showCard();
  }

  function finishSession() {
    stopAudio();
    show('done');
    document.getElementById('done-msg').textContent =
      `You reviewed ${total} flashcard${total === 1 ? '' : 's'}. Great work!`;
  }

  // ── Audio ─────────────────────────────────────────────────────────────────
  function playCardAudio(cardId, btn) {
    stopAudio();
    currentAudio = new Audio(`/api/audio/${cardId}`);
    currentAudio.play();
    btn.classList.add('playing');
    currentAudio.onended = () => btn.classList.remove('playing');
  }

  function stopAudio() {
    if (currentAudio) {
      currentAudio.pause();
      currentAudio = null;
    }
  }

  // ── Browse all cards ──────────────────────────────────────────────────────
  async function showBrowse() {
    document.getElementById('browse-overlay').style.display = 'flex';
    const list = document.getElementById('card-list');
    list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px">Loading…</p>';
    try {
      const { cards } = await fetch('/api/cards/all').then(r => r.json());
      document.getElementById('card-count').textContent = cards.length;
      if (cards.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px">No cards yet.</p>';
        return;
      }
      list.innerHTML = '';
      cards.forEach(card => renderCardListItem(card, list));
    } catch {
      list.innerHTML = '<p style="color:var(--again);padding:16px">Failed to load cards.</p>';
    }
  }

  function renderCardListItem(card, container) {
    const item = document.createElement('div');
    item.className = 'card-list-item';
    item.id = `cli-${card.id}`;
    item.innerHTML = `
      <div class="card-display" id="display-${card.id}">
        <div class="chinese">${escHtml(card.chinese)}</div>
        <div class="jyutping">${escHtml(card.jyutping)}</div>
        <div class="english">${escHtml(card.english)}</div>
      </div>
      <div class="card-edit-form" id="edit-form-${card.id}" style="display:none">
        <input class="edit-input" id="edit-en-${card.id}" value="${escAttr(card.english)}" placeholder="English">
        <input class="edit-input" id="edit-zh-${card.id}" value="${escAttr(card.chinese)}" placeholder="Chinese">
        <input class="edit-input" id="edit-jy-${card.id}" value="${escAttr(card.jyutping)}" placeholder="Jyutping">
        <div class="edit-actions">
          <button class="edit-save-btn" onclick="saveCard(${card.id})">Save</button>
          <button class="edit-cancel-btn" onclick="cancelEdit(${card.id})">Cancel</button>
        </div>
      </div>
      <div class="card-actions" id="actions-${card.id}">
        <button class="edit-card-btn" onclick="startEdit(${card.id})" title="Edit">✏️</button>
        <button class="delete-card-btn" onclick="deleteCard(${card.id})" title="Delete">🗑</button>
      </div>
    `;
    container.appendChild(item);
  }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function escAttr(s) {
    return String(s).replace(/"/g, '&quot;');
  }

  function startEdit(id) {
    document.getElementById(`display-${id}`).style.display = 'none';
    document.getElementById(`actions-${id}`).style.display = 'none';
    document.getElementById(`edit-form-${id}`).style.display = 'block';
    document.getElementById(`edit-en-${id}`).focus();
  }

  function cancelEdit(id) {
    document.getElementById(`display-${id}`).style.display = '';
    document.getElementById(`actions-${id}`).style.display = '';
    document.getElementById(`edit-form-${id}`).style.display = 'none';
  }

  async function saveCard(id) {
    const english = document.getElementById(`edit-en-${id}`).value.trim();
    const chinese = document.getElementById(`edit-zh-${id}`).value.trim();
    const jyutping = document.getElementById(`edit-jy-${id}`).value.trim();
    if (!english || !chinese || !jyutping) {
      showToast('All fields are required.');
      return;
    }
    const btn = document.querySelector(`#edit-form-${id} .edit-save-btn`);
    btn.disabled = true;
    btn.textContent = 'Saving…';
    try {
      const res = await fetch(`/api/cards/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ english, chinese, jyutping }),
      });
      if (!res.ok) throw new Error();
      // Update display
      const display = document.getElementById(`display-${id}`);
      display.querySelector('.chinese').textContent = chinese;
      display.querySelector('.jyutping').textContent = jyutping;
      display.querySelector('.english').textContent = english;
      cancelEdit(id);
      showToast('Card updated.');
    } catch {
      showToast('Failed to save card.');
    } finally {
      btn.disabled = false;
      btn.textContent = 'Save';
    }
  }

  function closeBrowse(e) {
    if (!e || e.target === document.getElementById('browse-overlay')) {
      document.getElementById('browse-overlay').style.display = 'none';
    }
  }

  async function deleteCard(id) {
    if (!confirm('Delete this card and all its progress?')) return;
    await fetch(`/api/cards/${id}`, { method: 'DELETE' });
    document.getElementById(`cli-${id}`)?.remove();
    const count = document.getElementById('card-count');
    count.textContent = parseInt(count.textContent) - 1;
    // Remove from current session queue if present
    const qi = queue.findIndex(c => c.card_id === id);
    if (qi !== -1) {
      const removed = queue.splice(qi, 1).length;
      total = Math.max(0, total - removed);
      if (qi < idx) idx = Math.max(0, idx - removed);
    }
  }

  // ── Toast ─────────────────────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  // ── Keyboard shortcuts ────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (document.getElementById('browse-overlay').style.display !== 'none') return;
    if (document.getElementById('state-review').style.display === 'none') return;

    if (!revealed) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealCard(); }
    } else {
      if (e.key === '1') rate('again');
      else if (e.key === '2') rate('hard');
      else if (e.key === '3') rate('good');
      else if (e.key === '4') rate('easy');
    }
  });

  loadSession();
</script>
</body>
</html>
