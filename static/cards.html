<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粵語學習 — Flashcards</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="粵語學習">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <script src="/static/label-picker.js"></script>
  <style>
    .offline-bar {
      background: #f57c00;
      color: white;
      font-size: 0.8rem;
      text-align: center;
      padding: 6px 16px;
      display: none;
    }
    .offline-bar.show { display: block; }
    .sync-badge {
      display: inline-block;
      background: white;
      color: #f57c00;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 10px;
      padding: 1px 7px;
      margin-left: 6px;
      vertical-align: middle;
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .card-edit-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.3;
      padding: 2px 4px;
      border-radius: 4px;
      transition: opacity 0.15s;
      flex-shrink: 0;
      line-height: 1;
    }
    .card-edit-btn:hover { opacity: 1; }
    .card-inline-edit {
      display: none;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      padding-top: 4px;
    }
    .card-inline-edit .edit-input { font-size: 1rem; }
  </style>
</head>
<body>

<div class="offline-bar" id="offline-bar">
  Offline — using cached cards
  <span class="sync-badge" id="sync-badge" style="display:none"></span>
</div>

<header>
  <h1>廣東<span class="logo-accent">卡</span></h1>
  <nav style="display:flex;gap:4px;align-items:center">
    <button class="nav-link" onclick="showBrowse()" style="border:none;cursor:pointer;background:none">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
      Browse
    </button>
    <a href="/" class="nav-link">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Translate
    </a>
  </nav>
</header>

<!-- Filter bar -->
<div class="filter-bar">
  <div id="filter-picker-wrap" style="flex:1;min-width:0"></div>
  <button class="filter-manage-btn" onclick="showManageLabels()" title="Manage labels" aria-label="Manage labels">
    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
  </button>
</div>

<!-- Loading state -->
<div class="cards-page" id="state-loading">
  <div class="empty-state">
    <div class="icon">⏳</div>
    <h2>Loading…</h2>
  </div>
</div>

<!-- No cards in DB at all -->
<div class="cards-page" id="state-empty" style="display:none">
  <div class="empty-state">
    <div class="icon">📚</div>
    <h2 id="empty-title">No flashcards yet</h2>
    <p id="empty-msg">Translate some phrases to build your deck.</p>
    <a href="/" class="cta-btn">Go Translate</a>
  </div>
</div>

<!-- Cards exist but none due -->
<div class="cards-page" id="state-caughtup" style="display:none">
  <div class="empty-state">
    <div class="icon">🎉</div>
    <h2>All caught up!</h2>
    <p id="caughtup-msg">No cards due right now.</p>
    <button class="cta-btn" onclick="loadSession('all')">Practice Anyway</button>
  </div>
</div>

<!-- Session complete -->
<div class="cards-page" id="state-done" style="display:none">
  <div class="empty-state">
    <div class="icon">✅</div>
    <h2>Session complete!</h2>
    <p id="done-msg"></p>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:4px">
      <a href="/" class="cta-btn">Translate More</a>
      <button class="cta-btn secondary" onclick="loadSession('all')">Practice More</button>
    </div>
  </div>
</div>

<!-- Active review -->
<div class="cards-page" id="state-review" style="display:none">
  <div class="session-progress">
    <span id="progress-label"></span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
  </div>

  <div class="card-wrap">
    <div class="flashcard" id="flashcard">
      <div class="card-header">
        <div class="card-prompt-label" id="prompt-label"></div>
        <button class="card-edit-btn" onclick="startInlineEdit()" title="Edit card" aria-label="Edit card">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
        </button>
      </div>
      <div class="card-prompt-text" id="prompt-text"></div>
      <div class="card-answer" id="card-answer" style="display:none"></div>
      <!-- Inline edit form -->
      <div class="card-inline-edit" id="card-inline-edit">
        <input class="edit-input" id="inline-en" placeholder="English">
        <input class="edit-input" id="inline-zh" placeholder="Chinese" style="font-family:var(--chinese-font);font-size:1.1rem">
        <input class="edit-input" id="inline-jy" placeholder="Jyutping">
        <textarea class="edit-input" id="inline-notes" placeholder="Notes (optional)" rows="2"></textarea>
        <div class="inline-labels-section">
          <div class="inline-labels-title">Labels</div>
          <div id="inline-label-picker"></div>
        </div>
        <div class="edit-actions">
          <button class="edit-save-btn" onclick="saveInlineEdit()">Save</button>
          <button class="edit-cancel-btn" onclick="cancelInlineEdit()">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Before reveal -->
    <div id="pre-reveal">
      <button class="reveal-btn" onclick="revealCard()">Show Answer</button>
      <p class="rating-hint">Press <kbd>Space</kbd> or <kbd>Enter</kbd> to reveal</p>
    </div>

    <!-- After reveal -->
    <div id="post-reveal" style="display:none">
      <div class="rating-btns">
        <button class="rating-btn again" onclick="rate('again')">
          Again <span class="key-hint">[ 1 ]</span>
        </button>
        <button class="rating-btn hard" onclick="rate('hard')">
          Hard <span class="key-hint">[ 2 ]</span>
        </button>
        <button class="rating-btn good" onclick="rate('good')">
          Good <span class="key-hint">[ 3 ]</span>
        </button>
        <button class="rating-btn easy" onclick="rate('easy')">
          Easy <span class="key-hint">[ 4 ]</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Browse modal -->
<div class="modal-overlay" id="browse-overlay" style="display:none" onclick="closeBrowse(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 style="font-size:1.1rem">All Cards (<span id="card-count">0</span>)</h2>
      <button class="modal-close" onclick="closeBrowse()" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div id="card-list"></div>
  </div>
</div>

<!-- Manage labels modal -->
<div class="modal-overlay" id="labels-overlay" style="display:none" onclick="closeManageLabels(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2 style="font-size:1.1rem">Manage Labels</h2>
      <button class="modal-close" onclick="closeManageLabels()" aria-label="Close">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="manage-labels-create">
      <input type="text" id="new-label-input" class="edit-input" placeholder="New label name…" maxlength="50">
      <button class="edit-save-btn" onclick="createLabelFromModal()">Add</button>
    </div>
    <div id="labels-manage-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── SVG icon strings (Lucide-style) ───────────────────────────────────────
  const ICONS = {
    pencil:  '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
    trash:   '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
    volume:  '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>',
    note:    '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;vertical-align:-2px"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>',
  };

  // ── State ─────────────────────────────────────────────────────────────────
  let queue = [];
  let total = 0;
  let idx = 0;
  let revealed = false;
  let currentAudio = null;
  let isOnline = navigator.onLine;
  let allLabels = [];
  let filterLabelId = null;
  let filterPicker = null;
  let inlinePicker = null;   // review inline-edit picker

  // ── IndexedDB ─────────────────────────────────────────────────────────────
  let _db = null;

  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open('cantonese-app', 1);
      req.onupgradeneeded = e => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('cards')) db.createObjectStore('cards', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('pending')) db.createObjectStore('pending', { autoIncrement: true });
      };
      req.onsuccess = e => resolve(e.target.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function idb() { if (!_db) _db = await openDB(); return _db; }

  async function idbPut(store, value) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).put(value);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }

  async function idbGetAll(store) {
    const db = await idb();
    return new Promise((res, rej) => {
      const req = db.transaction(store).objectStore(store).getAll();
      req.onsuccess = () => res(req.result); req.onerror = () => rej(req.error);
    });
  }

  async function idbClear(store) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).clear();
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }

  async function idbDelete(store, key) {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      tx.objectStore(store).delete(key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  }

  async function idbGetAllWithKeys(store) {
    const db = await idb();
    return new Promise((res, rej) => {
      const items = [];
      const req = db.transaction(store).objectStore(store).openCursor();
      req.onsuccess = e => {
        const cursor = e.target.result;
        if (cursor) { items.push({ key: cursor.key, value: cursor.value }); cursor.continue(); }
        else res(items);
      };
      req.onerror = () => rej(req.error);
    });
  }

  // ── Offline / sync bar ────────────────────────────────────────────────────
  function updateOfflineBar(pendingCount) {
    const bar = document.getElementById('offline-bar');
    const badge = document.getElementById('sync-badge');
    if (!isOnline) {
      bar.classList.add('show');
      if (pendingCount > 0) { badge.textContent = `${pendingCount} pending sync`; badge.style.display = 'inline-block'; }
      else badge.style.display = 'none';
    } else if (pendingCount > 0) {
      bar.classList.add('show');
      bar.firstChild.textContent = 'Back online — syncing… ';
      badge.textContent = `${pendingCount} reviews`; badge.style.display = 'inline-block';
    } else {
      bar.classList.remove('show');
    }
  }

  async function syncPending() {
    const entries = await idbGetAllWithKeys('pending');
    if (entries.length === 0) return;
    let synced = 0;
    for (const { key, value } of entries) {
      try {
        const res = await fetch(`/api/cards/${value.card_id}/review`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quality: value.quality, face: value.face }),
        });
        if (res.ok) { await idbDelete('pending', key); synced++; }
      } catch { break; }
    }
    if (synced > 0) {
      const remaining = entries.length - synced;
      if (remaining === 0) {
        showToast(`Synced ${synced} review${synced === 1 ? '' : 's'}.`);
        updateOfflineBar(0);
        document.getElementById('offline-bar').firstChild.textContent = 'Offline — using cached cards ';
      } else { updateOfflineBar(remaining); }
    }
  }

  window.addEventListener('online', () => { isOnline = true; syncPending(); });
  window.addEventListener('offline', () => { isOnline = false; idbGetAllWithKeys('pending').then(e => updateOfflineBar(e.length)); });

  // ── Labels ────────────────────────────────────────────────────────────────
  async function loadLabels() {
    try {
      const { labels } = await fetch('/api/labels').then(r => r.json());
      allLabels = labels;
    } catch { allLabels = []; }

    if (filterPicker) {
      filterPicker.setLabels(allLabels);
    } else {
      filterPicker = new LabelPicker(
        document.getElementById('filter-picker-wrap'),
        {
          allLabels,
          initialIds: filterLabelId ? [filterLabelId] : [],
          allowCreate: false,
          mode: 'single',
          placeholder: 'Filter by label…',
          onChange: ids => {
            const id = [...ids][0] ?? null;
            if (id !== filterLabelId) {
              filterLabelId = id;
              loadSession('due');
            }
          },
        }
      );
    }

    // Update any currently-open inline picker
    if (inlinePicker) inlinePicker.setLabels(allLabels);
  }

  function filterQuery() {
    return filterLabelId ? `?label_id=${filterLabelId}` : '';
  }

  // ── Boot ──────────────────────────────────────────────────────────────────
  async function loadSession(mode = 'due') {
    show('loading');
    if (isOnline) await syncPending();
    const pending = await idbGetAllWithKeys('pending');
    updateOfflineBar(pending.length);

    let cards;
    if (isOnline) {
      try {
        const url = (mode === 'all' ? '/api/cards/all-faces' : '/api/cards/due') + filterQuery();
        ({ cards } = await fetch(url).then(r => r.json()));
        if (mode === 'due' && !filterLabelId) {
          await idbClear('cards');
          for (const c of cards) await idbPut('cards', { ...c, id: `${c.card_id}-${c.face}` });
        }
      } catch {
        showToast('Network error — using cached cards.');
        cards = await idbGetAll('cards');
        isOnline = false;
      }
    } else {
      cards = await idbGetAll('cards');
      if (filterLabelId) cards = cards.filter(c => (c.labels || []).some(l => l.id === filterLabelId));
    }

    const emptyTitle = document.getElementById('empty-title');
    const emptyMsg   = document.getElementById('empty-msg');
    const caughtupMsg = document.getElementById('caughtup-msg');
    if (filterLabelId) {
      const name = (allLabels.find(l => l.id === filterLabelId) || {}).name || 'this label';
      emptyTitle.textContent = `No cards for "${name}"`;
      emptyMsg.textContent   = 'Try a different label or translate something new.';
      caughtupMsg.textContent = `No cards due for "${name}".`;
    } else {
      emptyTitle.textContent  = 'No flashcards yet';
      emptyMsg.textContent    = 'Translate some phrases to build your deck.';
      caughtupMsg.textContent = 'No cards due right now.';
    }

    if (cards.length === 0) {
      if (mode === 'due') {
        if (isOnline) {
          const { cards: all } = await fetch('/api/cards/all-faces' + filterQuery()).then(r => r.json()).catch(() => ({ cards: [] }));
          show(all.length === 0 ? 'empty' : 'caughtup');
        } else { show('caughtup'); }
      } else { show('empty'); }
      return;
    }

    queue = shuffle(cards);
    total = queue.length;
    idx = 0;
    show('review');
    showCard();
  }

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ── Show / hide states ────────────────────────────────────────────────────
  function show(state) {
    ['loading', 'empty', 'caughtup', 'done', 'review'].forEach(s =>
      document.getElementById(`state-${s}`).style.display = s === state ? '' : 'none'
    );
  }

  // ── Render card ───────────────────────────────────────────────────────────
  function showCard() {
    if (idx >= queue.length) { finishSession(); return; }
    const item = queue[idx];
    revealed = false;
    stopAudio();
    document.getElementById('card-answer').style.display = 'none';
    document.getElementById('pre-reveal').style.display = '';
    document.getElementById('post-reveal').style.display = 'none';

    const done = idx;
    document.getElementById('progress-label').textContent = `${done} / ${total}`;
    document.getElementById('progress-fill').style.width = `${(done / total) * 100}%`;

    const promptEl = document.getElementById('prompt-text');
    promptEl.className = 'card-prompt-text';
    promptEl.innerHTML = '';

    const labelMap = { english: 'English', chinese: 'Chinese', cantonese: 'Cantonese' };
    document.getElementById('prompt-label').textContent = labelMap[item.face];

    if (item.face === 'english') {
      promptEl.classList.add('is-english');
      promptEl.textContent = item.english;
    } else if (item.face === 'chinese') {
      promptEl.classList.add('is-chinese');
      promptEl.textContent = item.chinese;
    } else {
      promptEl.classList.add('is-cantonese');
      const audioBtn = document.createElement('button');
      audioBtn.className = 'audio-btn';
      audioBtn.innerHTML = `${ICONS.volume} Play`;
      audioBtn.onclick = () => playCardAudio(item.card_id, audioBtn);
      const jyEl = document.createElement('div');
      jyEl.className = 'jyutping-display';
      jyEl.textContent = item.jyutping;
      promptEl.appendChild(audioBtn);
      promptEl.appendChild(jyEl);
    }
  }

  // ── Reveal ────────────────────────────────────────────────────────────────
  function revealCard() {
    if (revealed) return;
    revealed = true;
    const item = queue[idx];
    const answerEl = document.getElementById('card-answer');
    answerEl.innerHTML = '';

    ['english', 'chinese', 'cantonese'].filter(f => f !== item.face).forEach(face => {
      const row = document.createElement('div');
      row.className = 'answer-row';
      const label = document.createElement('div');
      label.className = 'answer-label';
      if (face === 'english') {
        label.textContent = 'English';
        const val = document.createElement('div');
        val.className = 'answer-value'; val.textContent = item.english;
        row.appendChild(label); row.appendChild(val);
      } else if (face === 'chinese') {
        label.textContent = 'Chinese';
        const val = document.createElement('div');
        val.className = 'answer-value chinese'; val.textContent = item.chinese;
        row.appendChild(label); row.appendChild(val);
      } else {
        label.textContent = 'Cantonese';
        const jyEl = document.createElement('div');
        jyEl.className = 'answer-value jyutping'; jyEl.textContent = item.jyutping;
        const audioBtn = document.createElement('button');
        audioBtn.className = 'audio-btn'; audioBtn.style.marginTop = '6px';
        audioBtn.innerHTML = `${ICONS.volume} Play`;
        audioBtn.onclick = () => playCardAudio(item.card_id, audioBtn);
        row.appendChild(label); row.appendChild(jyEl); row.appendChild(audioBtn);
      }
      answerEl.appendChild(row);
    });

    // Notes (collapsed)
    if (item.notes && item.notes.trim()) {
      const det = document.createElement('details');
      det.className = 'review-notes';
      const sum = document.createElement('summary'); sum.innerHTML = `${ICONS.note} Notes`;
      const body = document.createElement('div'); body.className = 'review-notes-body';
      body.textContent = item.notes;
      det.appendChild(sum); det.appendChild(body);
      answerEl.appendChild(det);
    }

    // Labels
    if (item.labels && item.labels.length) {
      const row = document.createElement('div');
      row.className = 'review-labels';
      item.labels.forEach(lbl => {
        const chip = document.createElement('span');
        chip.className = 'label-chip-static'; chip.textContent = lbl.name;
        row.appendChild(chip);
      });
      answerEl.appendChild(row);
    }

    answerEl.style.display = 'flex';
    document.getElementById('pre-reveal').style.display = 'none';
    document.getElementById('post-reveal').style.display = '';

    if (item.face !== 'cantonese') {
      const dummyBtn = { classList: { add: () => {}, remove: () => {} } };
      setTimeout(() => playCardAudio(item.card_id, dummyBtn), 300);
    }
  }

  // ── Rate ──────────────────────────────────────────────────────────────────
  async function rate(quality) {
    const item = queue[idx];
    if (isOnline) {
      try {
        await fetch(`/api/cards/${item.card_id}/review`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quality, face: item.face }),
        });
      } catch {
        isOnline = false;
        await idbPut('pending', { card_id: item.card_id, quality, face: item.face });
        updateOfflineBar((await idbGetAllWithKeys('pending')).length);
      }
    } else {
      await idbPut('pending', { card_id: item.card_id, quality, face: item.face });
      updateOfflineBar((await idbGetAllWithKeys('pending')).length);
    }
    idx++;
    showCard();
  }

  function finishSession() {
    stopAudio();
    show('done');
    document.getElementById('done-msg').textContent =
      `You reviewed ${total} flashcard${total === 1 ? '' : 's'}. Great work!`;
  }

  // ── Audio ──────────────────────────────────────────────────────────────────
  function playCardAudio(cardId, btn) {
    stopAudio();
    currentAudio = new Audio(`/api/audio/${cardId}`);
    currentAudio.play();
    btn.classList.add('playing');
    currentAudio.onended = () => btn.classList.remove('playing');
  }

  function stopAudio() {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
  }

  // ── Browse all cards ───────────────────────────────────────────────────────
  async function showBrowse() {
    document.getElementById('browse-overlay').style.display = 'flex';
    const list = document.getElementById('card-list');
    list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px">Loading…</p>';
    try {
      const { cards } = await fetch('/api/cards/all').then(r => r.json());
      document.getElementById('card-count').textContent = cards.length;
      if (cards.length === 0) {
        list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px">No cards yet.</p>';
        return;
      }
      list.innerHTML = '';
      cards.forEach(card => renderCardListItem(card, list));
    } catch {
      list.innerHTML = '<p style="color:var(--again);padding:16px">Failed to load cards.</p>';
    }
  }

  function renderCardListItem(card, container) {
    const item = document.createElement('div');
    item.className = 'card-list-item';
    item.id = `cli-${card.id}`;
    // Store label IDs for edit form initialisation
    item._cardLabelIds = (card.labels || []).map(l => l.id);

    const labelsHtml = (card.labels || []).map(l =>
      `<span class="label-chip-static">${escHtml(l.name)}</span>`
    ).join('');
    const notesHtml = card.notes
      ? `<details class="card-list-notes"><summary>${ICONS.note} Note</summary><div>${escHtml(card.notes)}</div></details>`
      : '';

    item.innerHTML = `
      <div class="card-display" id="display-${card.id}">
        <div class="chinese">${escHtml(card.chinese)}</div>
        <div class="jyutping">${escHtml(card.jyutping)}</div>
        <div class="english">${escHtml(card.english)}</div>
        ${labelsHtml ? `<div class="card-list-labels">${labelsHtml}</div>` : ''}
        ${notesHtml}
      </div>
      <div class="card-edit-form" id="edit-form-${card.id}" style="display:none">
        <input class="edit-input" id="edit-en-${card.id}" value="${escAttr(card.english)}" placeholder="English">
        <input class="edit-input" id="edit-zh-${card.id}" value="${escAttr(card.chinese)}" placeholder="Chinese">
        <input class="edit-input" id="edit-jy-${card.id}" value="${escAttr(card.jyutping)}" placeholder="Jyutping">
        <textarea class="edit-input" id="edit-notes-${card.id}" placeholder="Notes (optional)" rows="2">${escHtml(card.notes || '')}</textarea>
        <div class="inline-labels-section">
          <div class="inline-labels-title">Labels</div>
          <div id="edit-labels-${card.id}"></div>
        </div>
        <div class="edit-actions">
          <button class="edit-save-btn" onclick="saveCard(${card.id})">Save</button>
          <button class="edit-cancel-btn" onclick="cancelEdit(${card.id})">Cancel</button>
        </div>
      </div>
      <div class="card-actions" id="actions-${card.id}">
        <button class="edit-card-btn" onclick="startEdit(${card.id})" title="Edit" aria-label="Edit">${ICONS.pencil}</button>
        <button class="delete-card-btn" onclick="deleteCard(${card.id})" title="Delete" aria-label="Delete">${ICONS.trash}</button>
      </div>
    `;
    container.appendChild(item);
  }

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s) { return String(s).replace(/"/g,'&quot;'); }

  function startEdit(id) {
    document.getElementById(`display-${id}`).style.display = 'none';
    document.getElementById(`actions-${id}`).style.display = 'none';
    document.getElementById(`edit-form-${id}`).style.display = 'block';
    document.getElementById(`edit-en-${id}`).focus();

    // Mount a fresh LabelPicker in the edit form
    const item = document.getElementById(`cli-${id}`);
    const pickerContainer = document.getElementById(`edit-labels-${id}`);
    pickerContainer.innerHTML = '';
    item._editPicker = new LabelPicker(pickerContainer, {
      allLabels,
      initialIds: item._cardLabelIds || [],
      allowCreate: true,
      mode: 'multi',
      placeholder: 'Add label…',
      onLabelsRefreshed: labels => { allLabels = labels; if (filterPicker) filterPicker.setLabels(labels); },
    });
  }

  function cancelEdit(id) {
    document.getElementById(`display-${id}`).style.display = '';
    document.getElementById(`actions-${id}`).style.display = '';
    document.getElementById(`edit-form-${id}`).style.display = 'none';
    const item = document.getElementById(`cli-${id}`);
    item._editPicker = null;
  }

  async function saveCard(id) {
    const english  = document.getElementById(`edit-en-${id}`).value.trim();
    const chinese  = document.getElementById(`edit-zh-${id}`).value.trim();
    const jyutping = document.getElementById(`edit-jy-${id}`).value.trim();
    const notes    = document.getElementById(`edit-notes-${id}`).value;
    const item     = document.getElementById(`cli-${id}`);
    const labelIds = item._editPicker ? [...item._editPicker.getSelected()] : [];

    if (!english || !chinese || !jyutping) { showToast('English, Chinese, and Jyutping are required.'); return; }
    const btn = document.querySelector(`#edit-form-${id} .edit-save-btn`);
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await fetch(`/api/cards/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ english, chinese, jyutping, notes, label_ids: labelIds }),
      });
      if (!res.ok) throw new Error();

      const display = document.getElementById(`display-${id}`);
      display.querySelector('.chinese').textContent = chinese;
      display.querySelector('.jyutping').textContent = jyutping;
      display.querySelector('.english').textContent = english;
      const oldLabels = display.querySelector('.card-list-labels');
      if (oldLabels) oldLabels.remove();
      const oldNotes = display.querySelector('.card-list-notes');
      if (oldNotes) oldNotes.remove();
      const selectedLabels = allLabels.filter(l => labelIds.includes(l.id));
      if (selectedLabels.length) {
        const row = document.createElement('div');
        row.className = 'card-list-labels';
        selectedLabels.forEach(l => {
          const chip = document.createElement('span');
          chip.className = 'label-chip-static'; chip.textContent = l.name;
          row.appendChild(chip);
        });
        display.appendChild(row);
      }
      if (notes && notes.trim()) {
        const det = document.createElement('details');
        det.className = 'card-list-notes';
        det.innerHTML = `<summary>${ICONS.note} Note</summary><div>${escHtml(notes)}</div>`;
        display.appendChild(det);
      }
      item._cardLabelIds = labelIds;
      cancelEdit(id);
      showToast('Card updated.');
      // Patch queue copies so the live session sees the changes
      queue.forEach(q => {
        if (q.card_id === id) { q.english = english; q.chinese = chinese; q.jyutping = jyutping; q.notes = notes; q.labels = selectedLabels; }
      });
      loadLabels();
    } catch { showToast('Failed to save card.'); }
    finally { btn.disabled = false; btn.textContent = 'Save'; }
  }

  function closeBrowse(e) {
    if (!e || e.target === document.getElementById('browse-overlay'))
      document.getElementById('browse-overlay').style.display = 'none';
  }

  async function deleteCard(id) {
    if (!confirm('Delete this card and all its progress?')) return;
    await fetch(`/api/cards/${id}`, { method: 'DELETE' });
    document.getElementById(`cli-${id}`)?.remove();
    const count = document.getElementById('card-count');
    count.textContent = parseInt(count.textContent) - 1;
    const qi = queue.findIndex(c => c.card_id === id);
    if (qi !== -1) {
      queue.splice(qi, 1);
      total = Math.max(0, total - 1);
      if (qi < idx) idx = Math.max(0, idx - 1);
    }
    loadLabels();
  }

  // ── Manage labels modal ────────────────────────────────────────────────────
  async function showManageLabels() {
    await loadLabels();
    document.getElementById('labels-overlay').style.display = 'flex';
    document.getElementById('new-label-input').value = '';
    renderManageLabelsList();
  }

  function renderManageLabelsList() {
    const list = document.getElementById('labels-manage-list');
    list.innerHTML = '';
    if (allLabels.length === 0) {
      list.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:16px">No labels yet.</p>';
      return;
    }
    allLabels.forEach(lbl => {
      const row = document.createElement('div');
      row.className = 'label-manage-row';
      row.innerHTML = `
        <input class="edit-input label-manage-name" value="${escAttr(lbl.name)}" maxlength="50">
        <span class="label-manage-count">${lbl.card_count}</span>
        <button class="edit-save-btn label-manage-save">Save</button>
        <button class="delete-card-btn label-manage-delete" title="Delete label" aria-label="Delete label">${ICONS.trash}</button>
      `;
      row.querySelector('.label-manage-save').onclick = () =>
        renameLabel(lbl.id, row.querySelector('.label-manage-name').value);
      row.querySelector('.label-manage-delete').onclick = () => deleteLabel(lbl.id, lbl.name);
      list.appendChild(row);
    });
  }

  async function createLabelFromModal() {
    const input = document.getElementById('new-label-input');
    const name = input.value.trim();
    if (!name) return;
    try {
      const res = await fetch('/api/labels', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      if (!res.ok) throw new Error();
      input.value = '';
      await loadLabels();
      renderManageLabelsList();
    } catch { showToast('Could not create label.'); }
  }

  async function renameLabel(id, name) {
    name = name.trim();
    if (!name) return;
    try {
      const res = await fetch(`/api/labels/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name }),
      });
      if (!res.ok) { showToast((await res.text()) || 'Could not rename label.'); return; }
      await loadLabels();
      renderManageLabelsList();
      showToast('Label renamed.');
    } catch { showToast('Could not rename label.'); }
  }

  async function deleteLabel(id, name) {
    if (!confirm(`Delete label "${name}"? Cards keep their other labels.`)) return;
    try {
      await fetch(`/api/labels/${id}`, { method: 'DELETE' });
      if (filterLabelId === id) {
        filterLabelId = null;
        if (filterPicker) filterPicker.setSelected([]);
      }
      await loadLabels();
      renderManageLabelsList();
    } catch { showToast('Could not delete label.'); }
  }

  function closeManageLabels(e) {
    if (!e || e.target === document.getElementById('labels-overlay'))
      document.getElementById('labels-overlay').style.display = 'none';
  }

  // ── Toast ──────────────────────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  // ── Inline card edit (review) ─────────────────────────────────────────────
  function startInlineEdit() {
    const item = queue[idx];
    document.getElementById('inline-en').value    = item.english;
    document.getElementById('inline-zh').value    = item.chinese;
    document.getElementById('inline-jy').value    = item.jyutping;
    document.getElementById('inline-notes').value = item.notes || '';

    // Mount a fresh picker
    const pickerContainer = document.getElementById('inline-label-picker');
    pickerContainer.innerHTML = '';
    inlinePicker = new LabelPicker(pickerContainer, {
      allLabels,
      initialIds: (item.labels || []).map(l => l.id),
      allowCreate: true,
      mode: 'multi',
      placeholder: 'Add label…',
      onLabelsRefreshed: labels => { allLabels = labels; if (filterPicker) filterPicker.setLabels(labels); },
    });

    document.getElementById('prompt-text').style.display    = 'none';
    document.getElementById('card-answer').style.display    = 'none';
    document.getElementById('pre-reveal').style.display     = 'none';
    document.getElementById('post-reveal').style.display    = 'none';
    document.getElementById('card-inline-edit').style.display = 'flex';
    document.getElementById('inline-en').focus();
  }

  async function saveInlineEdit() {
    const item     = queue[idx];
    const english  = document.getElementById('inline-en').value.trim();
    const chinese  = document.getElementById('inline-zh').value.trim();
    const jyutping = document.getElementById('inline-jy').value.trim();
    const notes    = document.getElementById('inline-notes').value;
    const labelIds = inlinePicker ? [...inlinePicker.getSelected()] : [];
    if (!english || !chinese || !jyutping) { showToast('English, Chinese, and Jyutping are required.'); return; }

    const btn = document.querySelector('#card-inline-edit .edit-save-btn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try {
      const res = await fetch(`/api/cards/${item.card_id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ english, chinese, jyutping, notes, label_ids: labelIds }),
      });
      if (!res.ok) throw new Error();
      const selectedLabels = allLabels.filter(l => labelIds.includes(l.id));
      queue.forEach(q => {
        if (q.card_id === item.card_id) { q.english = english; q.chinese = chinese; q.jyutping = jyutping; q.notes = notes; q.labels = selectedLabels; }
      });
      cancelInlineEdit();
      showToast('Card updated.');
      loadLabels();
    } catch { showToast('Failed to save.'); }
    finally { btn.disabled = false; btn.textContent = 'Save'; }
  }

  function cancelInlineEdit() {
    inlinePicker = null;
    document.getElementById('card-inline-edit').style.display  = 'none';
    document.getElementById('prompt-text').style.display        = '';
    if (revealed) {
      document.getElementById('card-answer').style.display  = 'flex';
      document.getElementById('post-reveal').style.display  = '';
    } else {
      document.getElementById('pre-reveal').style.display = '';
    }
  }

  // ── Keyboard shortcuts ─────────────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (document.getElementById('browse-overlay').style.display !== 'none') return;
    if (document.getElementById('labels-overlay').style.display !== 'none') return;
    if (document.getElementById('state-review').style.display === 'none') return;
    if (document.getElementById('card-inline-edit').style.display !== 'none') return;
    if (!revealed) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); revealCard(); }
    } else {
      if (e.key === '1') rate('again');
      else if (e.key === '2') rate('hard');
      else if (e.key === '3') rate('good');
      else if (e.key === '4') rate('easy');
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  (async () => { await loadLabels(); loadSession(); })();
</script>
</body>
</html>
