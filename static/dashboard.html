<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f5f4ef">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Admin Dashboard</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="stylesheet" href="/static/pages/dashboard.css">
</head>
<body>

<header>{{NAV}}</header>

<div class="dash" id="dash">
  <div class="dash-header">
    <h2>Admin Dashboard</h2>
    <button class="refresh-btn" onclick="loadDashboard()">Refresh</button>
  </div>
  <div id="dash-content">
    <div class="loading-msg">Loading dashboard...</div>
  </div>
</div>

<script src="/static/pages/dashboard.js"></script>
</body>
</html>
