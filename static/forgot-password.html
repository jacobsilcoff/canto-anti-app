<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f5f4ef">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Forgot password</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .login-wrap { flex:1; display:flex; align-items:center; justify-content:center; padding:24px; }
    .login-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 32px 28px; width:100%; max-width:360px;
      display:flex; flex-direction:column; gap:16px;
    }
    .login-card h2 { font-size:1.3rem; font-weight:700; color:var(--text); text-align:center; }
    .login-card p { font-size:0.88rem; color:var(--text-muted); text-align:center; margin:0; }
    .login-card input {
      width:100%; padding:12px 14px; border:1px solid var(--border); border-radius:8px;
      font-size:1rem; font-family:inherit; color:var(--text); outline:none; box-sizing:border-box;
    }
    .login-card input:focus { border-color: var(--primary); }
    .login-error { color:var(--again); font-size:0.87rem; text-align:center; display:none; }
    .login-success { color:var(--good); font-size:0.9rem; text-align:center; display:none; }
    .login-footer { font-size:0.83rem; text-align:center; color:var(--text-muted); }
    .login-footer a { color:var(--primary); text-decoration:none; }
    .login-footer a:hover { text-decoration:underline; }
  </style>
</head>
<body>
<header>
  <h1>{{APP_NAME_HTML}}</h1>
</header>
<div class="login-wrap">
  <form class="login-card" onsubmit="doRequest(event)">
    <h2>Forgot password?</h2>
    <p>Enter your email and we'll send you a reset link.</p>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email" autofocus>
    <button class="translate-btn" type="submit" id="submit-btn">Send reset link</button>
    <div class="login-error" id="req-error"></div>
    <div class="login-success" id="req-success"></div>
    <div class="login-footer"><a href="/login">Back to sign in</a></div>
  </form>
</div>
<script>
  async function doRequest(e) {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const btn = document.getElementById('submit-btn');
    const err = document.getElementById('req-error');
    const ok = document.getElementById('req-success');
    err.style.display = 'none'; ok.style.display = 'none';
    if (!email) return;
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      // Always show success to avoid leaking whether email exists.
      ok.textContent = 'If that email is registered, a reset link is on its way.';
      ok.style.display = 'block';
      btn.style.display = 'none';
    } catch {
      err.textContent = 'Network error — please try again.';
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Send reset link';
    }
  }
</script>
</body>
</html>
