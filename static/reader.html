<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f5f4ef">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Reader</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Sans+Thai:wght@400;500&family=Noto+Sans+Hebrew:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/pages/reader.css">
</head>
<body>

<header>{{NAV}}</header>

<main class="reader-page">

  <!-- Tab switcher -->
  <div class="reader-tabs" id="reader-tabs">
    <button class="reader-tab active" onclick="switchTab('mine')">My Stories</button>
    <button class="reader-tab" onclick="switchTab('community')">Community</button>
  </div>

  <!-- Home: generate + saved list -->
  <div id="home-view">
    <button class="new-reading-card" id="new-reading-card" type="button" onclick="toggleGenForm()">
      <span class="nr-plus"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
      <span class="nr-txt"><b>New reading</b><small>AI story · from URL · PDF · photo</small></span>
      <span class="nr-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg></span>
    </button>
    <div class="gen-form" id="gen-form">
      <h2>Add a reading</h2>
      <div class="gen-mode-tabs">
        <button class="gen-mode-tab active" data-mode="ai" onclick="setGenMode('ai')">✨ AI Story</button>
        <button class="gen-mode-tab" data-mode="url" onclick="setGenMode('url')">🔗 From URL</button>
        <button class="gen-mode-tab" data-mode="pdf" onclick="setGenMode('pdf')">📄 From PDF</button>
      </div>

      <!-- AI Story: prompt and/or image, with difficulty + length -->
      <div class="gen-mode-pane" id="gen-pane-ai">
        <div class="gen-prompt-wrap">
          <textarea id="gen-prompt" placeholder="Optional: describe what you want to read, or leave blank for a surprise" rows="3"></textarea>
        </div>
        <div class="gen-image-row">
          <input type="file" id="gen-image-input" accept="image/*" style="display:none" onchange="onImageSelect(this)">
          <button class="gen-image-btn" onclick="document.getElementById('gen-image-input').click()">📷 Add image</button>
          <img class="gen-image-preview" id="gen-image-preview">
          <span class="gen-image-name" id="gen-image-name"></span>
          <button class="gen-image-clear" id="gen-image-clear" style="display:none" onclick="clearImage()" title="Remove image">✕</button>
        </div>
        <div class="gen-bottom-row">
          <div class="gen-options">
            <div class="gen-option-group">
              <div class="gen-option-label">Difficulty</div>
              <select id="gen-difficulty" class="settings-select" onchange="saveDifficultyPref()">
                <option value="A1">A1 · Beginner</option>
                <option value="A2">A2 · Elementary</option>
                <option value="B1">B1 · Intermediate</option>
                <option value="B2">B2 · Upper Int.</option>
                <option value="C1">C1 · Advanced</option>
                <option value="C2">C2 · Mastery</option>
              </select>
            </div>
            <div class="gen-option-group">
              <div class="gen-option-label">Length</div>
              <select id="gen-paragraphs" class="settings-select">
                <option value="1">1 paragraph</option>
                <option value="2">2 paragraphs</option>
                <option value="3">3 paragraphs</option>
                <option value="4" selected>4 paragraphs</option>
                <option value="5">5 paragraphs</option>
                <option value="6">6 paragraphs</option>
                <option value="8">8 paragraphs</option>
                <option value="10">10 paragraphs</option>
              </select>
            </div>
          </div>
          <button class="gen-submit-btn" id="gen-btn" onclick="generate()">Generate</button>
        </div>
      </div>

      <!-- From URL: paste an article link -->
      <div class="gen-mode-pane" id="gen-pane-url" style="display:none">
        <input type="url" id="gen-url-input" class="gen-url-input" placeholder="Paste an article URL">
        <label class="gen-intarget">
          <input type="checkbox" id="gen-url-intarget">
          <span>This is already in my target language</span>
        </label>
        <div class="gen-bottom-row">
          <div class="gen-options">
            <div class="gen-option-group">
              <div class="gen-option-label">Level</div>
              <select id="gen-url-difficulty" class="settings-select">
                <option value="original" selected>Keep original</option>
                <option value="A1">A1 · Beginner</option>
                <option value="A2">A2 · Elementary</option>
                <option value="B1">B1 · Intermediate</option>
                <option value="B2">B2 · Upper Int.</option>
                <option value="C1">C1 · Advanced</option>
                <option value="C2">C2 · Mastery</option>
              </select>
            </div>
          </div>
          <button class="gen-submit-btn" onclick="generate()">Import</button>
        </div>
      </div>

      <!-- From PDF: upload a document -->
      <div class="gen-mode-pane" id="gen-pane-pdf" style="display:none">
        <div class="gen-image-row">
          <input type="file" id="gen-pdf-input" accept="application/pdf,.pdf" style="display:none" onchange="onPdfSelect(this)">
          <button class="gen-image-btn" onclick="document.getElementById('gen-pdf-input').click()">📄 Choose PDF</button>
          <span class="gen-image-name" id="gen-pdf-name">No file chosen</span>
          <button class="gen-image-clear" id="gen-pdf-clear" style="display:none" onclick="clearPdf()" title="Remove PDF">✕</button>
        </div>
        <label class="gen-intarget">
          <input type="checkbox" id="gen-pdf-intarget">
          <span>This is already in my target language</span>
        </label>
        <div class="gen-bottom-row">
          <div class="gen-options">
            <div class="gen-option-group">
              <div class="gen-option-label">Level</div>
              <select id="gen-pdf-difficulty" class="settings-select">
                <option value="original" selected>Keep original</option>
                <option value="A1">A1 · Beginner</option>
                <option value="A2">A2 · Elementary</option>
                <option value="B1">B1 · Intermediate</option>
                <option value="B2">B2 · Upper Int.</option>
                <option value="C1">C1 · Advanced</option>
                <option value="C2">C2 · Mastery</option>
              </select>
            </div>
          </div>
          <button class="gen-submit-btn" onclick="generate()">Import</button>
        </div>
      </div>
    </div>
    <div class="saved-section" id="saved-section" style="display:none">
      <h3>Your stories</h3>
      <div class="saved-list" id="saved-list"></div>
    </div>
  </div>

  <!-- Community view -->
  <div id="community-view" style="display:none">
    <div class="community-filters">
      <input type="text" id="comm-search" placeholder="Search stories…" oninput="loadCommunity()">
      <select id="comm-lang" onchange="loadCommunity()"></select>
      <select id="comm-difficulty" onchange="loadCommunity()">
        <option value="">Any level</option>
        <option value="A1">A1</option><option value="A2">A2</option>
        <option value="B1">B1</option><option value="B2">B2</option>
        <option value="C1">C1</option><option value="C2">C2</option>
      </select>
      <select id="comm-length" onchange="loadCommunity()">
        <option value="">Any length</option>
        <option value="short">Short</option>
        <option value="medium">Medium</option>
        <option value="long">Long</option>
      </select>
      <select id="comm-sort" onchange="loadCommunity()">
        <option value="newest">Newest</option>
        <option value="rating">Top rated</option>
        <option value="popular">Most rated</option>
      </select>
    </div>
    <div class="saved-list" id="community-list"></div>
  </div>

  <!-- Loading view (shown during generate + preload) -->
  <div id="loading-view" style="display:none">
    <div class="loading-view">
      <div class="loading-title">Preparing your reading…</div>
      <div class="loading-steps">
        <div class="loading-step" id="step-generate">
          <div class="step-icon"><div class="step-dot"></div></div>
          <span>Generating text</span>
        </div>
        <div class="loading-step" id="step-preload">
          <div class="step-icon"><div class="step-dot"></div></div>
          <span>Translating sentences &amp; creating audio</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Reader view -->
  <div id="reader-view" style="display:none">
    <div class="reader-header">
      <div class="reader-title-row">
        <div class="reader-title" id="reader-title"></div>
        <button class="reader-close-btn" onclick="showHome()" title="Close">✕</button>
      </div>
      <div class="reader-header-actions">
        <button class="reader-vocab-btn" id="reader-vocab-btn" onclick="reviewVocab()" title="Study vocab from this text" style="display:none">Study vocab</button>
        <button class="reader-add-all-btn" id="reader-add-all-btn" onclick="addAllVocab()" title="Add all unseen words to deck" style="display:none">+ Add all vocab</button>
        <button class="reader-quiz-btn" id="reader-quiz-btn" onclick="openQuiz()" title="Comprehension quiz" style="display:none">Quiz me</button>
      </div>
    </div>

    <!-- Author info (community stories) -->
    <div class="story-author" id="story-author" style="display:none"></div>

    <!-- Rating row (community stories) -->
    <div class="publish-row" id="publish-row" style="display:none">
      <span id="rating-section" style="display:none">
        <span class="rating-stars" id="rating-stars"></span>
        <span class="rating-info" id="rating-info"></span>
      </span>
    </div>

    <!-- Sentence translation panel -->
    <div class="sentence-panel" id="sentence-panel" onclick="onPanelClick()">
      <div class="sentence-panel-hint" id="panel-hint">Tap a sentence to see its translation here</div>
      <div id="panel-body" style="display:none">
        <div class="sentence-panel-hint" id="panel-reveal-hint" style="display:none">Click to show translation</div>
        <div id="panel-content" style="display:none">
          <div class="sentence-panel-translation" id="panel-translation"></div>
        </div>
      </div>
    </div>

    <img class="reader-image" id="reader-image" style="display:none" alt="Story inspiration">

    <div class="reader-legend">
      <span><span class="legend-dot known"></span>Known</span>
      <span><span class="legend-dot weak"></span>Weak</span>
      <span><span class="legend-dot new"></span>New to deck</span>
    </div>

    <div class="reader-text" id="reader-text"></div>

    <div class="page-nav" id="page-nav" style="display:none">
      <button class="page-btn" id="page-prev" onclick="goPage(-1)">← Prev</button>
      <span class="page-indicator" id="page-indicator"></span>
      <button class="page-btn audio-mode-btn" id="audio-mode-btn" onclick="audioPlayPause()" title="Auto-play sentences">
        <svg id="audio-play-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        <svg id="audio-pause-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
      </button>
      <button class="page-btn" id="rom-toggle-btn" onclick="toggleRomanization()" title="Toggle romanization" style="display:none; font-size:0.78rem; letter-spacing:0.02em">あ</button>
      <button class="page-btn" id="page-next" onclick="goPage(1)">Next →</button>
    </div>
  </div>
</main>

<!-- Comprehension quiz modal — centered dialog, tap backdrop to dismiss -->
<div id="quiz-modal" style="display:none" onclick="closeQuiz()">
  <div class="quiz-card" onclick="event.stopPropagation()">
    <div class="quiz-card-head">
      <span class="quiz-title">Comprehension check</span>
      <button class="quiz-close-btn" onclick="closeQuiz()">✕</button>
    </div>
    <div class="quiz-card-body">
      <div id="quiz-loading" class="quiz-loading" style="display:none">
        <span class="quiz-spinner"></span>Generating question…
      </div>
      <div id="quiz-body" style="display:none">
        <div class="quiz-question" id="quiz-question"></div>
        <div class="quiz-opts" id="quiz-opts"></div>
        <div class="quiz-feedback" id="quiz-feedback" style="display:none"></div>
        <div class="quiz-actions" id="quiz-actions" style="display:none">
          <button class="page-btn" onclick="closeQuiz()">Close</button>
          <button class="page-btn" onclick="loadQuiz()">Another question</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Word tooltip (floating, positioned by JS) -->
<div class="word-tooltip" id="word-tooltip" style="display:none" role="dialog">
  <button class="tooltip-close" onclick="closeTooltip()">✕</button>
  <div id="tooltip-content"></div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/pages/reader.js"></script>
</body>
</html>
