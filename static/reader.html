<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{APP_NAME}} — Reader</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    .reader-page { max-width: 720px; margin: 0 auto; padding: 16px 16px 60px; }

    /* ── Generate form ── */
    .gen-form { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 24px; display: flex; flex-direction: column; gap: 12px; }
    .gen-form h2 { font-size: 1rem; font-weight: 600; margin: 0; color: var(--text); }
    .gen-prompt-wrap textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); color: var(--text); padding: 9px 12px; font-size: 0.95rem; font-family: inherit; resize: vertical; min-height: 72px; }
    .gen-prompt-wrap textarea:focus { outline: none; border-color: var(--primary); }
    .gen-bottom-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
    .gen-options { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; flex: 1; }
    .gen-option-group { display: flex; flex-direction: column; gap: 3px; }
    .gen-option-label { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .gen-submit-btn { background: var(--primary); color: #fff; border: none; border-radius: 9px; padding: 9px 20px; font-size: 0.95rem; font-weight: 600; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
    .gen-submit-btn:disabled { opacity: 0.5; cursor: default; }
    .gen-submit-btn:hover:not(:disabled) { background: var(--primary-dark, #1a56db); }

    /* ── Saved texts list ── */
    .saved-section { margin-bottom: 24px; }
    .saved-section h3 { font-size: 0.85rem; font-weight: 600; color: var(--text-muted, #888); text-transform: uppercase; letter-spacing: 0.05em; margin: 0 0 10px; }
    .saved-list { display: flex; flex-direction: column; gap: 6px; }
    .saved-item { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .saved-item:hover { border-color: var(--primary); }
    .saved-item-info { flex: 1; min-width: 0; }
    .saved-item-title { font-weight: 600; font-size: 0.95rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .saved-item-meta { font-size: 0.78rem; color: var(--text-muted, #888); margin-top: 2px; }
    .saved-item-delete { background: none; border: none; cursor: pointer; color: var(--text-muted, #aaa); padding: 4px; border-radius: 6px; flex-shrink: 0; }
    .saved-item-delete:hover { color: #e53e3e; background: rgba(229,62,62,.08); }

    /* ── Reader view ── */
    .reader-view { display: none; }
    .reader-header { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .reader-title { font-size: 1.05rem; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reader-header-nav { display: flex; align-items: center; gap: 8px; }
    .reader-header-actions { display: flex; gap: 8px; margin-left: auto; }
    .reader-back-btn { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--text); cursor: pointer; padding: 6px 12px; font-size: 0.88rem; flex-shrink: 0; }
    .reader-back-btn:hover { border-color: var(--primary); }
    .reader-vocab-btn { background: var(--primary); border: none; border-radius: 8px; color: #fff; cursor: pointer; padding: 6px 12px; font-size: 0.88rem; flex-shrink: 0; }
    .reader-vocab-btn:hover { opacity: 0.88; }
    .reader-add-all-btn { background: none; border: 1px solid var(--primary); color: var(--primary); border-radius: 8px; cursor: pointer; padding: 6px 12px; font-size: 0.88rem; flex-shrink: 0; }
    .reader-add-all-btn:hover { background: var(--primary); color: #fff; }
    .reader-add-all-btn:disabled { opacity: 0.5; cursor: default; }

    /* ── Sentence translation panel ── */
    .sentence-panel {
      position: sticky;
      top: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
      z-index: 5;
      min-height: 64px;
      cursor: pointer;
      user-select: none;
    }
    .sentence-panel:hover { border-color: var(--primary); }
    .sentence-panel-hint { font-size: 0.88rem; color: var(--text-muted, #aaa); font-style: italic; text-align: center; width: 100%; display: block; }
    .sentence-panel-romanization { font-size: 0.82rem; color: var(--text-muted, #888); margin-bottom: 4px; }
    .sentence-panel-translation { font-size: 0.9rem; color: var(--text-muted, #666); line-height: 1.4; }
    .sentence-panel-loading { font-size: 0.88rem; color: var(--text-muted, #aaa); }
    .sentence-panel-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -2px; margin-right: 6px; }

    /* ── Legend ── */
    .reader-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; font-size: 0.8rem; color: var(--text-muted, #888); }
    .legend-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
    .legend-dot.known { background: #22c55e; }
    .legend-dot.weak   { background: #f59e0b; }
    .legend-dot.new    { background: #94a3b8; }

    /* ── Text body ── */
    .reader-text { font-size: 1.4rem; line-height: 2.2; font-family: 'Noto Sans TC', sans-serif; color: var(--text); overflow-wrap: break-word; }
    .reader-text.latin { font-size: 1.05rem; line-height: 1.9; font-family: inherit; }
    .sentence { cursor: pointer; border-radius: 4px; }
    .sentence.active { background: rgba(99,102,241,.07); }
    .token {}
    .token.word { cursor: pointer; border-radius: 3px; padding: 0 1px; transition: background 0.1s; }
    .token.word.known { color: #16a34a; }
    .token.word.weak  { color: #b45309; }
    .token.word.new   { color: var(--text); opacity: 0.55; }
    .token.word:hover, .token.word.tapped { background: rgba(99,102,241,.15); }
    ruby { ruby-align: center; }
    rt { font-size: 0.38em; font-family: inherit; letter-spacing: 0; visibility: hidden; }
    .reader-text.show-rom rt { visibility: visible; opacity: 0.7; }
    .rom-toggle-off { position: relative; }
    .rom-toggle-off::after { content: ''; position: absolute; left: 50%; top: 50%; width: 70%; height: 1.5px; background: currentColor; transform: translate(-50%, -50%) rotate(-45deg); opacity: 0.7; pointer-events: none; }

    /* ── Word tooltip ── */
    .word-tooltip {
      position: fixed;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.08);
      padding: 14px 16px;
      z-index: 200;
      min-width: 200px;
      max-width: 280px;
      pointer-events: auto;
    }
    .tooltip-word { font-size: 1.7rem; font-weight: 700; font-family: 'Noto Sans TC', sans-serif; color: var(--text); line-height: 1.2; }
    .tooltip-rom  { font-size: 0.9rem; color: var(--text-muted, #888); margin: 3px 0 5px; }
    .tooltip-eng  { font-size: 0.95rem; color: var(--text); margin-bottom: 8px; }
    .tooltip-notes { font-size: 0.8rem; color: var(--text-muted, #888); border-left: 2px solid var(--border); padding-left: 8px; margin-bottom: 10px; }
    .tooltip-status-badge { display: inline-block; font-size: 0.72rem; padding: 2px 8px; border-radius: 10px; margin-bottom: 10px; font-weight: 600; }
    .tooltip-status-badge.known { background: #dcfce7; color: #166534; }
    .tooltip-status-badge.weak  { background: #fef3c7; color: #92400e; }
    .tooltip-status-badge.new   { background: #f1f5f9; color: #475569; }
    .tooltip-loading { font-size: 0.88rem; color: var(--text-muted, #aaa); padding: 4px 0; }
    .tooltip-error  { font-size: 0.82rem; color: #e53e3e; }
    .tooltip-actions { display: flex; gap: 8px; align-items: center; }
    .tooltip-add-btn { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 7px 16px; font-size: 0.88rem; font-weight: 600; cursor: pointer; }
    .tooltip-add-btn:disabled { opacity: 0.5; cursor: default; }
    .tooltip-add-btn.added { background: #22c55e; }
    .tooltip-alt-meaning { background: var(--bg, #f8fafc); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; margin-bottom: 10px; font-size: 0.85rem; }
    .tooltip-alt-label { font-weight: 600; color: var(--text-muted, #888); font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.04em; margin-right: 4px; }
    .tooltip-update-meaning-btn { display: block; margin-top: 6px; background: none; border: 1px solid var(--primary); color: var(--primary); border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; }
    .tooltip-update-meaning-btn:hover { background: var(--primary); color: #fff; }
    .tooltip-flag-btn { background: none; border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 0.8rem; color: var(--text-muted, #888); cursor: pointer; }
    .tooltip-flag-btn:hover { border-color: #f59e0b; color: #b45309; }
    .tooltip-close { position: absolute; top: 8px; right: 10px; background: none; border: none; cursor: pointer; color: var(--text-muted, #bbb); font-size: 1rem; padding: 2px 6px; }
    .tooltip-close:hover { color: var(--text); }
    .play-btn { background: none; border: 1px solid var(--border); border-radius: 7px; cursor: pointer; color: var(--text-muted, #888); padding: 4px 8px; display: inline-flex; align-items: center; gap: 4px; font-size: 0.8rem; flex-shrink: 0; }
    .play-btn:hover { border-color: var(--primary); color: var(--primary); }
    .play-btn.playing { color: var(--primary); border-color: var(--primary); }


    /* ── Loading view ── */
    .loading-view { display: flex; flex-direction: column; align-items: center; padding: 48px 24px; }
    .loading-title { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 28px; }
    .loading-steps { display: flex; flex-direction: column; gap: 14px; width: 100%; max-width: 320px; }
    .loading-step { display: flex; align-items: center; gap: 12px; font-size: 0.92rem; color: var(--text-muted, #888); }
    .loading-step.active { color: var(--text); }
    .loading-step.done { color: #16a34a; }
    .step-icon { width: 20px; height: 20px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .step-spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; }
    .step-check { color: #16a34a; font-size: 1rem; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); margin: auto; }

    /* ── Paging ── */
    .page-nav { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 20px; }
    .page-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 9px; color: var(--text); cursor: pointer; padding: 8px 20px; font-size: 0.9rem; font-weight: 500; }
    .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
    .page-btn:disabled { opacity: 0.35; cursor: default; }
    .page-indicator { font-size: 0.82rem; color: var(--text-muted, #888); min-width: 60px; text-align: center; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .gen-spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -3px; margin-right: 6px; }

    /* ── Audio mode ── */
    .audio-mode-btn { display: flex; align-items: center; justify-content: center; }
    .audio-mode-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  </style>
</head>
<body>

<header>{{NAV}}</header>

<main class="reader-page">

  <!-- Home: generate + saved list -->
  <div id="home-view">
    <div class="gen-form">
      <h2>Generate a text to read</h2>
      <div class="gen-prompt-wrap">
        <textarea id="gen-prompt" placeholder="Describe what you want to read, e.g. "a short conversation at a dim sum restaurant"" rows="3"></textarea>
      </div>
      <div class="gen-bottom-row">
        <div class="gen-options">
          <div class="gen-option-group">
            <div class="gen-option-label">Difficulty</div>
            <select id="gen-difficulty" class="settings-select" onchange="saveDifficultyPref()">
              <option value="A1">A1 · Beginner</option>
              <option value="A2">A2 · Elementary</option>
              <option value="B1">B1 · Intermediate</option>
              <option value="B2">B2 · Upper Int.</option>
              <option value="C1">C1 · Advanced</option>
              <option value="C2">C2 · Mastery</option>
            </select>
          </div>
          <div class="gen-option-group">
            <div class="gen-option-label">Length</div>
            <select id="gen-paragraphs" class="settings-select">
              <option value="1">1 paragraph</option>
              <option value="2">2 paragraphs</option>
              <option value="3">3 paragraphs</option>
              <option value="4" selected>4 paragraphs</option>
              <option value="5">5 paragraphs</option>
              <option value="6">6 paragraphs</option>
              <option value="8">8 paragraphs</option>
              <option value="10">10 paragraphs</option>
            </select>
          </div>
        </div>
        <button class="gen-submit-btn" id="gen-btn" onclick="generate()">Generate</button>
      </div>
    </div>
    <div class="saved-section" id="saved-section" style="display:none">
      <h3>Saved texts</h3>
      <div class="saved-list" id="saved-list"></div>
    </div>
  </div>

  <!-- Loading view (shown during generate + preload) -->
  <div id="loading-view" style="display:none">
    <div class="loading-view">
      <div class="loading-title">Preparing your reading…</div>
      <div class="loading-steps">
        <div class="loading-step" id="step-generate">
          <div class="step-icon"><div class="step-dot"></div></div>
          <span>Generating text</span>
        </div>
        <div class="loading-step" id="step-preload">
          <div class="step-icon"><div class="step-dot"></div></div>
          <span>Translating sentences &amp; creating audio</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Reader view -->
  <div id="reader-view" style="display:none">
    <div class="reader-header">
      <div class="reader-title" id="reader-title"></div>
      <div class="reader-header-nav">
        <button class="reader-back-btn" onclick="showHome()">← Back</button>
        <div class="reader-header-actions">
          <button class="reader-vocab-btn" id="reader-vocab-btn" onclick="reviewVocab()" title="Study vocab from this text" style="display:none">Study vocab</button>
          <button class="reader-add-all-btn" id="reader-add-all-btn" onclick="addAllVocab()" title="Add all unseen words to deck" style="display:none">+ Add all vocab</button>
        </div>
      </div>
    </div>

    <!-- Sentence translation panel -->
    <div class="sentence-panel" id="sentence-panel" onclick="onPanelClick()">
      <div class="sentence-panel-hint" id="panel-hint">Tap a sentence to see its translation here</div>
      <div id="panel-body" style="display:none">
        <div class="sentence-panel-hint" id="panel-reveal-hint" style="display:none">Click to show translation</div>
        <div id="panel-content" style="display:none">
          <div class="sentence-panel-romanization" id="panel-romanization" style="display:none"></div>
          <div class="sentence-panel-translation" id="panel-translation"></div>
        </div>
      </div>
    </div>

    <div class="reader-legend">
      <span><span class="legend-dot known"></span>Known</span>
      <span><span class="legend-dot weak"></span>Weak</span>
      <span><span class="legend-dot new"></span>New to deck</span>
    </div>

    <div class="reader-text" id="reader-text"></div>

    <div class="page-nav" id="page-nav" style="display:none">
      <button class="page-btn" id="page-prev" onclick="goPage(-1)">← Prev</button>
      <span class="page-indicator" id="page-indicator"></span>
      <button class="page-btn audio-mode-btn" id="audio-mode-btn" onclick="audioPlayPause()" title="Auto-play sentences">
        <svg id="audio-play-icon" width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
      </button>
      <button class="page-btn" id="rom-toggle-btn" onclick="toggleRomanization()" title="Toggle romanization" style="display:none; font-size:0.78rem; letter-spacing:0.02em">あ</button>
      <button class="page-btn" id="page-next" onclick="goPage(1)">Next →</button>
    </div>
  </div>
</main>

<!-- Word tooltip (floating, positioned by JS) -->
<div class="word-tooltip" id="word-tooltip" style="display:none" role="dialog">
  <button class="tooltip-close" onclick="closeTooltip()">✕</button>
  <div id="tooltip-content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ── State ──────────────────────────────────────────────────────────────────
  const SENTENCES_PER_PAGE = 5;

  let selectedDifficulty = 'B1';

  let languages = [];
  let selectedLang = 'yue';
  let currentTextId = null;
  let currentTargetLang = 'yue';
  let sentences = [];         // [{tokens, text}]
  let currentPage = 0;
  let currentSentenceIdx = null;
  let activeWordEl = null;
  let tooltipWordData = null;
  let panelTranslationVisible = true;
  let romanizationOn = false;
  let romanizationMap = null;  // word → romanization, null = not yet loaded

  // ── Init ───────────────────────────────────────────────────────────────────
  async function init() {
    await Promise.all([loadLanguages(), loadDefaultLang()]);
    loadSavedTexts();
    loadStreak();
  }

  async function loadDefaultLang() {
    try {
      const s = await fetch('/api/settings').then(r => r.json());
      if (s.default_target_lang) selectedLang = s.default_target_lang;
      if (s.default_reader_difficulty) {
        selectedDifficulty = s.default_reader_difficulty;
        const sel = document.getElementById('gen-difficulty');
        if (sel) sel.value = selectedDifficulty;
      }
    } catch {}
  }

  async function saveDifficultyPref() {
    const val = document.getElementById('gen-difficulty').value;
    selectedDifficulty = val;
    try {
      await fetch('/api/settings', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ default_reader_difficulty: val }),
      });
    } catch {}
  }

  async function loadLanguages() {
    try {
      const res = await fetch('/api/languages').then(r => r.json());
      languages = res.languages;
    } catch {
      languages = [{ code: 'yue', name: 'Cantonese', flag: '🇭🇰' }];
    }
  }



  // ── Saved texts ────────────────────────────────────────────────────────────
  async function loadSavedTexts() {
    const res = await fetch('/api/reader/texts').then(r => r.json());
    const texts = res.texts || [];
    const section = document.getElementById('saved-section');
    if (!texts.length) { section.style.display = 'none'; return; }
    section.style.display = '';
    const list = document.getElementById('saved-list');
    list.innerHTML = '';
    texts.forEach(t => {
      const langInfo = languages.find(l => l.code === t.target_lang);
      const flag = langInfo?.flag || '';
      const date = new Date(t.created_at + 'Z').toLocaleDateString();
      const item = document.createElement('div');
      item.className = 'saved-item';
      item.innerHTML = `
        <div class="saved-item-info">
          <div class="saved-item-title">${esc(t.title)}</div>
          <div class="saved-item-meta">${flag} ${langInfo?.name || t.target_lang} · ${date}</div>
        </div>
        <button class="saved-item-delete" title="Delete" onclick="deleteText(event,${t.id})">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
        </button>`;
      item.querySelector('.saved-item-info').onclick = () => openSavedText(t.id);
      list.appendChild(item);
    });
  }

  async function deleteText(e, id) {
    e.stopPropagation();
    if (!confirm('Delete this text?')) return;
    await fetch(`/api/reader/texts/${id}`, { method: 'DELETE' });
    loadSavedTexts();
  }

  async function openSavedText(id) {
    showLoadingView();
    setStep('generate', 'done');
    try {
      const data = await fetch(`/api/reader/texts/${id}`).then(r => r.json());
      if (data.preload_complete) {
        setStep('preload', 'done');
        showReaderView(data);
      } else {
        setStep('preload', 'active');
        const preloaded = await fetch(`/api/reader/texts/${id}/preload`, { method: 'POST' }).then(r => r.json());
        setStep('preload', 'done');
        showReaderView({ ...data, sentences: preloaded.sentences, preload_complete: true });
      }
    } catch (err) {
      showToast('Failed to load text');
      showHome();
    }
  }

  // ── Generate ───────────────────────────────────────────────────────────────
  async function generate() {
    const prompt = document.getElementById('gen-prompt').value.trim();
    if (!prompt) { showToast('Enter a prompt first'); return; }
    const btn = document.getElementById('gen-btn');
    btn.disabled = true;

    showLoadingView();
    setStep('generate', 'active');

    try {
      const res = await fetch('/api/reader/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          target_lang: selectedLang,
          difficulty: selectedDifficulty,
          num_paragraphs: parseInt(document.getElementById('gen-paragraphs').value, 10) || 4,
        }),
      });
      if (!res.ok) { const err = await res.json(); throw new Error(err.detail || 'Generation failed'); }
      const data = await res.json();
      setStep('generate', 'done');
      loadSavedTexts();

      setStep('preload', 'active');
      const preloaded = await fetch(`/api/reader/texts/${data.id}/preload`, { method: 'POST' }).then(r => r.json());
      setStep('preload', 'done');

      showReaderView({ ...data, sentences: preloaded.sentences, preload_complete: true });
    } catch (err) {
      showToast(err.message || 'Generation failed');
      showHome();
    } finally {
      btn.disabled = false;
    }
  }

    document.getElementById('reader-view').style.display = 'none';

  // ── Reader view ────────────────────────────────────────────────────────────
  // sentenceCache: map of sentence_idx → {translation, has_audio}
  let sentenceCache = {};

  function showReaderView(data) {
    currentTextId = data.id;
    currentTargetLang = data.target_lang;
    currentSentenceIdx = null;
    currentPage = 0;
    // Build sentence cache from preloaded data
    sentenceCache = {};
    (data.sentences || []).forEach(s => { sentenceCache[s.sentence_idx] = s; });
    document.getElementById('reader-title').textContent = data.title;
    const isLatin = !['yue','cmn'].includes(data.target_lang);
    document.getElementById('reader-text').classList.toggle('latin', isLatin);
    sentences = buildSentences(data.tokens);
    // Must be set before renderPage so <rt> elements get their text on first render.
    romanizationOn = false;
    romanizationMap = data.romanization && Object.keys(data.romanization).length ? data.romanization : null;
    renderPage(0);
    resetPanel();
    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('home-view').style.display = 'none';
    document.getElementById('reader-view').style.display = 'block';
    // Show vocab review button (label created lazily on first card add).
    document.getElementById('reader-vocab-btn').style.display = '';
    document.getElementById('reader-add-all-btn').style.display = data.all_vocab_added ? 'none' : '';
    const romBtn = document.getElementById('rom-toggle-btn');
    romBtn.style.display = isLatin ? 'none' : '';
    romBtn.classList.remove('active');
    romBtn.classList.add('rom-toggle-off');
    document.getElementById('reader-text').classList.remove('show-rom');
  }

  async function addAllVocab() {
    const btn = document.getElementById('reader-add-all-btn');
    btn.disabled = true;
    btn.textContent = 'Adding…';
    try {
      const res = await fetch(`/api/reader/texts/${currentTextId}/add-all-vocab`, { method: 'POST' });
      if (!res.ok) throw new Error();
      const { added, skipped, total_new } = await res.json();
      if (total_new === 0) {
        showToast('All words already in your deck!');
        btn.style.display = 'none';
      } else {
        showToast(`Added ${added} card${added !== 1 ? 's' : ''}${skipped ? `, skipped ${skipped}` : ''}`);
        btn.style.display = 'none';
      }
      // Refresh token colours.
      const textRes = await fetch(`/api/reader/texts/${currentTextId}`);
      if (textRes.ok) {
        const data = await textRes.json();
        sentences = buildSentences(data.tokens);
        renderPage(currentPage);
      }
    } catch {
      showToast('Failed to add vocab — try again.');
      btn.disabled = false;
      btn.textContent = '+ Add all vocab';

  async function reviewVocab() {
    try {

      if (!res.ok) return;

  function showHome() {
    if (audioMode) audioStop();
    document.getElementById('reader-view').style.display = 'none';
    document.getElementById('loading-view').style.display = 'none';
    document.getElementById('home-view').style.display = 'block';
    closeTooltip();
    currentSentenceIdx = null;
  }

  // Split flat token list into sentence groups, split on sentence-ending punctuation.
  function buildSentences(tokens) {
    const result = [];
    let buf = [];
    let quoteDepth = 0;
    const openQuotes = new Set(['“', '«', '「', '『']);
    const closeQuotes = new Set(['”', '»', '」', '』']);
    const sentenceEnders = /[。！？.!?\n]/;

    tokens.forEach((tok, i) => {
      if (!tok.is_word) {
        for (const ch of tok.text) {
          if (openQuotes.has(ch)) quoteDepth++;
          else if (closeQuotes.has(ch)) quoteDepth = Math.max(0, quoteDepth - 1);
        }
      }
      buf.push(tok);
      if (!tok.is_word && quoteDepth === 0 && sentenceEnders.test(tok.text)) {
        // Skip numeric periods like "1.5"
        if (tok.text.includes('.') && !tok.text.includes('。') && /\d\.\d/.test(tok.text)) return;
        result.push(buf);
        buf = [];
      }
    });
    if (buf.length) result.push(buf);
    return result.map(toks => ({
      tokens: toks,
      text: toks.map(t => t.text).join(''),
    }));
  }

  function renderPage(pageIdx) {
    currentPage = pageIdx;
    const totalPages = Math.ceil(sentences.length / SENTENCES_PER_PAGE);
    const start = pageIdx * SENTENCES_PER_PAGE;
    const pageSentences = sentences.slice(start, start + SENTENCES_PER_PAGE);

    // Update paging controls
    const nav = document.getElementById('page-nav');
    nav.style.display = '';
    document.getElementById('page-prev').disabled = pageIdx === 0;
    document.getElementById('page-prev').style.visibility = totalPages > 1 ? '' : 'hidden';
    document.getElementById('page-next').disabled = pageIdx >= totalPages - 1;
    document.getElementById('page-next').style.visibility = totalPages > 1 ? '' : 'hidden';
    document.getElementById('page-indicator').textContent = totalPages > 1 ? `${pageIdx + 1} / ${totalPages}` : '';

    // Reset panel and tooltip when changing page
    closeTooltip();
    resetPanel();
    currentSentenceIdx = null;

    renderReader(pageSentences, start);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goPage(delta) {
    const totalPages = Math.ceil(sentences.length / SENTENCES_PER_PAGE);
    const next = Math.max(0, Math.min(totalPages - 1, currentPage + delta));
    if (next !== currentPage) renderPage(next);
  }

  function renderReader(pageSentences, globalOffset) {
    const container = document.getElementById('reader-text');
    container.innerHTML = '';
    pageSentences.forEach((sent, localIdx) => {
      const si = globalOffset + localIdx;
      const sentEl = document.createElement('span');
      sentEl.className = 'sentence';
      sentEl.dataset.si = si;
      sentEl.addEventListener('click', e => {
        // Clicking blank space in sentence (not on a word) → select sentence
        if (!e.target.classList.contains('word')) selectSentence(si, sentEl);
      });
      sent.tokens.forEach(tok => {
        let el;
        if (tok.is_word) {
          el = document.createElement('ruby');
          el.appendChild(document.createTextNode(tok.text));
          const rt = document.createElement('rt');
          rt.textContent = (romanizationMap && romanizationMap[tok.text]) || '';
          el.appendChild(rt);
        } else {
          el = document.createElement('span');
          el.textContent = tok.text;
        }

        el.className = 'token' + (tok.is_word ? ' word ' + (tok.status || 'new') : '');
        if (tok.is_word) {
          el.dataset.word = tok.text;
          el.dataset.si = si;
          el.addEventListener('click', e => {
            e.stopPropagation();
            onWordTap(el, tok.text, tok.status || 'new', si, sentEl);
          });
          let pressTimer;
          el.addEventListener('pointerdown', () => {
            pressTimer = setTimeout(() => onWordTap(el, tok.text, tok.status || 'new', si, sentEl), 300);
          });
          el.addEventListener('pointerup',    () => clearTimeout(pressTimer));
          el.addEventListener('pointerleave', () => clearTimeout(pressTimer));
        }
        sentEl.appendChild(el);
      });
      container.appendChild(sentEl);
    });
  }

  // ── Sentence panel ─────────────────────────────────────────────────────────
  function resetPanel() {
    document.getElementById('panel-hint').style.display = '';
    document.getElementById('panel-body').style.display = 'none';
    panelTranslationVisible = false;
  }

  function onPanelClick() {
    if (currentSentenceIdx === null) return;
    panelTranslationVisible = !panelTranslationVisible;
    document.getElementById('panel-content').style.display = panelTranslationVisible ? '' : 'none';
    document.getElementById('panel-reveal-hint').style.display = panelTranslationVisible ? 'none' : '';
  }

  async function selectSentence(si, sentEl) {
    const alreadySelected = currentSentenceIdx === si;

    document.querySelectorAll('.sentence.active').forEach(el => el.classList.remove('active'));
    if (!sentEl) sentEl = document.querySelector(`.sentence[data-si="${si}"]`);
    if (sentEl) sentEl.classList.add('active');
    currentSentenceIdx = si;

    // Keep audio mode in sync so playback resumes from the clicked sentence
    if (audioMode && audioSentenceIdx !== si) {
      audioSentenceIdx = si;
      if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
    }

    document.getElementById('panel-hint').style.display = 'none';
    document.getElementById('panel-body').style.display = '';

    document.getElementById('panel-content').style.display = panelTranslationVisible ? '' : 'none';
    document.getElementById('panel-reveal-hint').style.display = panelTranslationVisible ? 'none' : '';

    const cached = sentenceCache[si];
    if (cached?.translation) {
      setPanelRomanization(cached.romanization);
      document.getElementById('panel-translation').textContent = cached.translation;
      return;
    }

    // Fallback: live Gemini call
    setPanelRomanization(null);
    document.getElementById('panel-translation').innerHTML =
      '<span class="sentence-panel-spinner"></span><span class="sentence-panel-loading">Translating…</span>';
    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text: sentences[si].text, target_lang: currentTargetLang, source_is_target: true }),
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      const cand = data.candidates?.[0] || {};
      setPanelRomanization(cand.romanization);
      document.getElementById('panel-translation').textContent = cand.english || '';
      if (!sentenceCache[si]) sentenceCache[si] = {};
      sentenceCache[si].translation = cand.english || '';
      sentenceCache[si].romanization = cand.romanization || null;
    } catch {
      document.getElementById('panel-translation').textContent = 'Translation failed.';
    }
  }

  function setPanelRomanization(rom) {
    const el = document.getElementById('panel-romanization');
    if (rom) { el.textContent = rom; el.style.display = ''; }
    else { el.textContent = ''; el.style.display = 'none'; }
  }

  // ── Word tooltip ───────────────────────────────────────────────────────────
  async function onWordTap(el, word, status, si, sentEl) {
    // Select sentence
    selectSentence(si, sentEl);

    // Mark the word as active
    if (activeWordEl) activeWordEl.classList.remove('tapped');
    activeWordEl = el;
    el.classList.add('tapped');

    // Show tooltip with loading state
    positionTooltip(el);
    document.getElementById('tooltip-content').innerHTML =
      `<div class="tooltip-loading"><span class="sentence-panel-spinner"></span> Looking up…</div>`;
    document.getElementById('word-tooltip').style.display = '';

    try {
      const fullText = sentences[si].text;
      const res = await fetch('/api/reader/translate-word', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ word, context: fullText, target_lang: currentTargetLang }),
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      tooltipWordData = data;
      renderTooltip(data);
    } catch {
      document.getElementById('tooltip-content').innerHTML =
        `<div class="tooltip-error">Lookup failed — try again.</div>`;
    }
  }

  function positionTooltip(el) {
    const tooltip = document.getElementById('word-tooltip');
    tooltip.style.display = 'block';
    const rect = el.getBoundingClientRect();
    const tw = tooltip.offsetWidth || 240;
    const th = tooltip.offsetHeight || 160;
    const margin = 8;
    let left = rect.left;
    let top  = rect.bottom + margin;
    if (left + tw > window.innerWidth - margin) left = window.innerWidth - tw - margin;
    if (left < margin) left = margin;
    if (top + th > window.innerHeight - margin) top = rect.top - th - margin;
    tooltip.style.left = left + 'px';
    tooltip.style.top  = top  + 'px';
  }

  function renderTooltip(data) {
    const isInDeck = data.source === 'deck';
    const statusLabel = { known: 'Known', weak: 'Weak', new: 'New to deck' }[data.status] || 'New';
    const hasAltMeaning = isInDeck && data.context_source_text;
    document.getElementById('tooltip-content').innerHTML = `
      <div class="tooltip-word">${esc(data.target_text)}</div>
      ${data.romanization ? `<div class="tooltip-rom">${esc(data.romanization)}</div>` : ''}
      <div class="tooltip-eng">${esc(data.source_text)}</div>
      <span class="tooltip-status-badge ${data.status}">${statusLabel}</span>
      ${data.notes ? `<div class="tooltip-notes">${esc(data.notes)}</div>` : ''}
      ${hasAltMeaning ? `
        <div class="tooltip-alt-meaning">
          <span class="tooltip-alt-label">In context:</span> ${esc(data.context_source_text)}
          ${data.context_notes ? `<div class="tooltip-notes">${esc(data.context_notes)}</div>` : ''}
          <button class="tooltip-update-meaning-btn" id="tooltip-update-meaning-btn" onclick="updateCardMeaning()">Update card meaning</button>
        </div>` : ''}
      <div class="tooltip-actions">
        <button class="play-btn" onclick="playText(tooltipWordData.target_text)" title="Play pronunciation">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        </button>
        <button class="tooltip-add-btn ${isInDeck ? 'added' : ''}" id="tooltip-add-btn"
          ${isInDeck ? 'disabled' : ''} onclick="addWordToDeck()">
          ${isInDeck ? 'In deck ✓' : 'Add to deck'}
        </button>
        ${!isInDeck ? `<button class="tooltip-flag-btn" onclick="showToast('Flagging will be available in a future update')">Flag</button>` : ''}
      </div>
    `;
  }

  async function updateCardMeaning() {
    if (!tooltipWordData || !tooltipWordData.card_id || !tooltipWordData.context_source_text) return;
    const btn = document.getElementById('tooltip-update-meaning-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Updating…'; }
    try {
      const res = await fetch(`/api/cards/${tooltipWordData.card_id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          source_text:  tooltipWordData.context_source_text,
          target_text:  tooltipWordData.target_text,
          romanization: tooltipWordData.context_romanization || tooltipWordData.romanization || '',
          notes:        tooltipWordData.context_notes || tooltipWordData.notes || '',
        }),
      });
      if (!res.ok) throw new Error();
      tooltipWordData = { ...tooltipWordData, source_text: tooltipWordData.context_source_text, context_source_text: null };
      document.querySelector('.tooltip-alt-meaning')?.remove();
      document.querySelector('.tooltip-eng').textContent = tooltipWordData.source_text;
      showToast('Card meaning updated');
    } catch {
      if (btn) { btn.disabled = false; btn.textContent = 'Update card meaning'; }
      showToast('Failed to update card');
    }

  async function addWordToDeck() {
    if (!tooltipWordData || tooltipWordData.source === 'deck') return;
    const btn = document.getElementById('tooltip-add-btn');
    btn.disabled = true;
    btn.textContent = 'Adding…';
    try {
      const res = await fetch('/api/cards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          source_text:     tooltipWordData.source_text,
          target_text:     tooltipWordData.target_text,
          romanization:    tooltipWordData.romanization || '',
          target_lang:     currentTargetLang,
          notes:           tooltipWordData.notes || '',
          priority:        tooltipWordData.priority || 3,

          suggested_labels: tooltipWordData.suggested_labels || [],
          classifier:      tooltipWordData.classifier || '',

        }),

  // ── TTS ────────────────────────────────────────────────────────────────────
  let _currentAudio = null;

  async function playText(text) {
    if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
    try {
      const res = await fetch('/api/reader/tts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, target_lang: currentTargetLang }),
      });
      if (!res.ok) throw new Error();
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      _currentAudio = new Audio(url);
      _currentAudio.onended = () => { URL.revokeObjectURL(url); _currentAudio = null; };
      _currentAudio.play();
    } catch {
      showToast('Audio unavailable');
    }
  }

  async function playUrl(url) {
    if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error();
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      _currentAudio = new Audio(objUrl);
      _currentAudio.onended = () => { URL.revokeObjectURL(objUrl); _currentAudio = null; };
      _currentAudio.play();
    } catch {
      showToast('Audio unavailable');
    }
  }

  // ── Toast ──────────────────────────────────────────────────────────────────
  let _toastTimer;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Romanization toggle ────────────────────────────────────────────────────
  function toggleRomanization() {
    romanizationOn = !romanizationOn;
    const btn = document.getElementById('rom-toggle-btn');
    btn.classList.toggle('active', romanizationOn);
    btn.classList.toggle('rom-toggle-off', !romanizationOn);
    document.getElementById('reader-text').classList.toggle('show-rom', romanizationOn);
  }

  // ── Audio Mode ─────────────────────────────────────────────────────────────
  let audioMode = false;
  let audioPlaying = false;
  let audioSentenceIdx = 0;
  let _audioModeAbort = false;

  function audioPlayPause() {
    if (!audioMode) {
      // Start audio mode from current page
      audioMode = true;
      audioSentenceIdx = currentPage * SENTENCES_PER_PAGE;
      _audioModeAbort = false;
      audioPlaying = true;
      setAudioPlayPauseUI(true);
      runAudioMode();
    } else if (audioPlaying) {
      audioPlaying = false;
      if (_currentAudio) _currentAudio.pause();
      setAudioPlayPauseUI(false);
    } else {
      audioPlaying = true;
      setAudioPlayPauseUI(true);
      if (_currentAudio) _currentAudio.play();
      else runAudioMode();
    }
  }

  function audioStop() {
    _audioModeAbort = true;
    audioMode = false;
    audioPlaying = false;
    if (_currentAudio) { _currentAudio.pause(); _currentAudio = null; }
    setAudioPlayPauseUI(false);
  }

  function setAudioPlayPauseUI(playing) {
    const icon = document.getElementById('audio-play-icon');
    if (playing) {
      icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
    } else {
      icon.innerHTML = '<polygon points="5 3 19 12 5 21 5 3"/>';
    }
    document.getElementById('audio-mode-btn').classList.toggle('active', playing);
  }

  async function runAudioMode() {
    while (audioMode && !_audioModeAbort && audioSentenceIdx < sentences.length) {
      if (!audioPlaying) {
        // Paused — wait
        await new Promise(r => setTimeout(r, 100));
        continue;
      }

      const si = audioSentenceIdx;

      // Make sure the right page is showing
      const targetPage = Math.floor(si / SENTENCES_PER_PAGE);
      if (targetPage !== currentPage) {
        renderPage(targetPage);
        await new Promise(r => setTimeout(r, 50));
      }

      // Scroll active sentence into view and update the panel
      const sentEl = document.querySelector(`.sentence[data-si="${si}"]`);
      if (sentEl) sentEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      await selectSentence(si, sentEl);

      // Play audio
      await playAudioModeStep(si);

      if (_audioModeAbort) break;

      // Brief pause between sentences
      await new Promise(r => setTimeout(r, 400));

      audioSentenceIdx++;
    }

    if (!_audioModeAbort && audioSentenceIdx >= sentences.length) {
      // Reached the end
        showToast('Audio playback complete');
      audioStop();
    }
  }

  function playAudioModeStep(si) {
    return new Promise(resolve => {
      if (_audioModeAbort) { resolve(); return; }

      const cached = sentenceCache[si];
      let fetchPromise;

      if (cached?.has_audio) {
        fetchPromise = fetch(`/api/reader/texts/${currentTextId}/sentences/${si}/audio`)
          .then(r => { if (!r.ok) throw new Error(); return r.blob(); });
      } else {
        fetchPromise = fetch('/api/reader/tts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: sentences[si].text, target_lang: currentTargetLang }),
        }).then(r => { if (!r.ok) throw new Error(); return r.blob(); });
      }

      fetchPromise.then(blob => {
        if (_audioModeAbort) { resolve(); return; }
        const url = URL.createObjectURL(blob);
        _currentAudio = new Audio(url);

        _currentAudio.onended = () => {
          URL.revokeObjectURL(url);
          _currentAudio = null;
          resolve();
        };
        _currentAudio.onerror = () => { URL.revokeObjectURL(url); _currentAudio = null; resolve(); };

        // If paused while fetching, don't auto-play — wait for resume
        if (audioPlaying && !_audioModeAbort) {
          _currentAudio.play().catch(() => resolve());
        } else {
          // Paused state: wait for play to be called
          const checkInterval = setInterval(() => {
            if (_audioModeAbort) { clearInterval(checkInterval); _currentAudio = null; resolve(); return; }
            if (audioPlaying && _currentAudio) {
              clearInterval(checkInterval);
              _currentAudio.play().catch(() => resolve());
            }
          }, 100);
        }
      }).catch(() => resolve());
    });
  }

  init();
</script>
