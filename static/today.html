<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f5f4ef">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Home</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .today-page { max-width: 560px; margin: 0 auto; padding: 14px 16px 40px; width: 100%; box-sizing: border-box; flex: 1; }
    .greet { padding: 8px 2px 14px; }
    .greet h2 { font-size: 1.45rem; font-weight: 800; }
    .greet p { color: var(--text-muted); font-size: 0.88rem; margin-top: 2px; }

    .tcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 16px; }

    /* Daily goal: ring + streak in one card */
    .goal { display: flex; align-items: center; gap: 16px; }
    .ring { position: relative; width: 74px; height: 74px; flex-shrink: 0; }
    .ring svg { transform: rotate(-90deg); }
    .ring .ring-track { fill: none; stroke: var(--surface-alt); stroke-width: 8; }
    .ring .ring-arc { fill: none; stroke: var(--warn-accent); stroke-width: 8; stroke-linecap: round;
      transition: stroke-dashoffset .6s ease; }
    .ring.met .ring-arc { stroke: var(--good); }
    .ring .ring-num { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
      justify-content: center; font-family: var(--display-font); font-weight: 800; font-size: 1.05rem; line-height: 1; }
    .ring .ring-num small { font-size: 0.58rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }
    .goal-txt { flex: 1; min-width: 0; }
    .goal-kicker { font-size: 0.66rem; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); }
    .goal-txt h3 { font-size: 1.02rem; margin: 3px 0 4px; }
    .goal-txt p { font-size: 0.8rem; color: var(--text-muted); }
    .streak-chip { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
      background: var(--energy-soft); color: var(--energy); border-radius: 999px; padding: 4px 11px;
      font-weight: 800; font-size: 0.8rem; }

    /* Primary continue card */
    .next { margin-top: 12px; border: none; background: var(--primary); color: var(--on-primary);
      box-shadow: 0 4px 0 var(--primary-strong), var(--shadow); cursor: pointer; display: block;
      width: 100%; text-align: left; text-decoration: none; }
    .next .goal-kicker { color: rgba(255,255,255,0.72); }
    .next h3 { font-size: 1.15rem; margin: 4px 0 2px; color: var(--on-primary); }
    .next p { font-size: 0.82rem; opacity: 0.85; }
    .next .go { margin-top: 12px; background: var(--surface); color: var(--primary); border-radius: 12px;
      padding: 10px 18px; font-weight: 800; display: inline-flex; gap: 6px; border: none; cursor: pointer;
      font-size: 0.92rem; }
    .next:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--primary-strong), var(--shadow); }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .mini { padding: 13px 14px; text-decoration: none; color: inherit; display: block; }
    .mini:hover { border-color: var(--primary); }
    .mini .n { font-family: var(--display-font); font-size: 1.5rem; font-weight: 800; line-height: 1.15; }
    .mini .lbl { font-size: 0.76rem; color: var(--text-muted); font-weight: 600; margin-top: 1px; }
    .mini .cta { margin-top: 8px; font-size: 0.78rem; font-weight: 700; color: var(--primary); }

    .quick { margin-top: 20px; }
    .quick h3 { font-size: 0.95rem; margin-bottom: 8px; }
    .quick-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .quick-chip { display: inline-flex; align-items: center; gap: 7px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 999px; padding: 9px 15px; font-weight: 600;
      font-size: 0.84rem; box-shadow: var(--shadow); text-decoration: none; color: var(--text); }
    .quick-chip:hover { border-color: var(--primary); color: var(--primary); }
    .quick-chip svg { width: 16px; height: 16px; }

    .today-loading { text-align: center; color: var(--text-muted); padding: 40px 0; }
    .spinner { display: inline-block; width: 18px; height: 18px; border: 3px solid var(--border);
      border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; vertical-align: -3px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<header>{{NAV}}</header>

<main class="today-page">
  <div class="greet">
    <h2 id="greet-line">Welcome back</h2>
    <p id="greet-sub"></p>
  </div>

  <div id="today-body">
    <div class="today-loading"><span class="spinner"></span></div>
  </div>
</main>

<script>
  const _svg = {
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>',
    book: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>',
    decks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
    flame: '<svg viewBox="0 0 16 20" width="13" height="16" aria-hidden="true"><path fill="currentColor" d="M8 0C5.5 3.5 3 6.5 3 10.5a5 5 0 0010 0c0-2-.9-3.8-1.8-4.8-.4 1.6-1.1 2.6-2 2.2.4-2.5.2-5.2-1.2-7.9z"/></svg>',
  };
  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }

  async function loadStreak() {
    try {
      const { streak, points } = await fetch('/api/streak').then(r => r.json());
      if (window.renderHeaderStats) { window.renderHeaderStats(streak || 0, points || 0); return; }
      const parts = [];
      const _flame = `<svg viewBox="0 0 16 20" width="13" height="16" aria-hidden="true"><path fill="#f4702a" d="M8 0C5.5 3.5 3 6.5 3 10.5a5 5 0 0010 0c0-2-.9-3.8-1.8-4.8-.4 1.6-1.1 2.6-2 2.2.4-2.5.2-5.2-1.2-7.9z"/></svg>`;
      const _star  = `<svg viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path fill="#f0b429" d="M10 1l2.2 6.8H19l-5.6 4.1 2.1 6.6L10 14.4l-5.5 4.1 2.1-6.6L1 7.8h6.8z"/></svg>`;
      const fmtN = n => n >= 10000 ? Math.round(n/1000)+'k' : n >= 1000 ? (n/1000).toFixed(1).replace(/\.0$/,'')+'k' : String(n);
      const ic = n => `<span style="display:inline-flex;align-items:center;gap:3px">${n}</span>`;
      if (streak > 0) parts.push(ic(`${fmtN(streak)} ${_flame}`));
      if (points > 0) parts.push(ic(`${fmtN(points)} ${_star}`));
      if (parts.length) {
        document.querySelectorAll('.streak-display').forEach(el => {
          el.innerHTML = parts.join('<span style="opacity:0.4;margin:0 4px">·</span>');
          el.style.display = '';
        });
      }
    } catch {}
  }

  function greeting() {
    const h = new Date().getHours();
    return h < 5 ? 'Up late' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
  }

  // Find the next playable AI lesson (falls back to a foundations lesson).
  function nextLesson(course) {
    if (!course) return null;
    let fallback = null;
    for (const u of (course.units || [])) {
      for (const l of (u.lessons || [])) {
        if (l.status !== 'available') continue;
        if (u.theme === 'foundations') { fallback = fallback || { lesson: l, unit: u }; continue; }
        return { lesson: l, unit: u };
      }
    }
    return fallback;
  }

  function ringHtml(today, goal) {
    const met = goal > 0 && today >= goal;
    const C = 2 * Math.PI * 31;
    const off = goal > 0 ? Math.max(0, C * (1 - Math.min(1, today / goal))) : C;
    const n = today >= 1000 ? (today / 1000).toFixed(1).replace(/\.0$/, '') + 'k' : String(today);
    return `<div class="ring${met ? ' met' : ''}">
      <svg width="74" height="74" viewBox="0 0 74 74">
        <circle class="ring-track" cx="37" cy="37" r="31"/>
        <circle class="ring-arc" cx="37" cy="37" r="31" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/>
      </svg>
      <div class="ring-num" title="${today.toLocaleString()} XP today">${n}<small>/ ${goal} XP</small></div>
    </div>`;
  }

  async function init() {
    loadStreak();
    const [me, streak, due, courseRes] = await Promise.all([
      fetch('/api/me').then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/api/streak').then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/api/cards/due-count').then(r => r.ok ? r.json() : null).catch(() => null),
      fetch('/api/courses/active').then(r => r.ok ? r.json() : null).catch(() => null),
    ]);

    const name = (me && (me.display_name || me.username)) || '';
    document.getElementById('greet-line').textContent = greeting() + (name ? `, ${name}` : '');
    const today = (streak && streak.points_today) || 0;
    const goal = (streak && streak.daily_goal) || 50;
    const remaining = Math.max(0, goal - today);
    document.getElementById('greet-sub').textContent =
      new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' })
      + (remaining > 0 ? ` · ${remaining} XP to today's goal` : ' · daily goal met!');

    const s = (streak && streak.streak) || 0;
    const goalTitle = remaining <= 0 ? 'Goal complete!' : (today > 0 ? 'Almost there' : 'Start your day');
    const goalSub = remaining <= 0
      ? 'Anything more is bonus XP.'
      : 'A lesson, a chat, or a quick review all count.';
    const streakChip = s > 0
      ? `<span class="streak-chip">${_svg.flame} ${s}-day streak — keep it alive</span>` : '';

    const nl = nextLesson(courseRes && courseRes.course);
    const nextCard = nl
      ? `<a class="tcard next" href="/learn">
           <span class="goal-kicker">Continue learning</span>
           <h3>${esc(nl.lesson.title || 'Next lesson')}</h3>
           <p>${esc(nl.unit.title ? nl.unit.title + ' · ' : '')}~5 min</p>
           <span class="go">Start lesson →</span>
         </a>`
      : `<a class="tcard next" href="/learn">
           <span class="goal-kicker">Learn</span>
           <h3>Start your course</h3>
           <p>AI lessons that adapt to the words you already know.</p>
           <span class="go">Open Learn →</span>
         </a>`;

    const dueN = (due && due.count) || 0;
    document.getElementById('today-body').innerHTML = `
      <div class="tcard goal">
        ${ringHtml(today, goal)}
        <div class="goal-txt">
          <div class="goal-kicker">Daily goal</div>
          <h3>${goalTitle}</h3>
          <p>${goalSub}</p>
          ${streakChip}
        </div>
      </div>
      ${nextCard}
      <div class="row2">
        <a class="tcard mini" href="/cards">
          <div class="n">${dueN}</div>
          <div class="lbl">card${dueN === 1 ? '' : 's'} due for review</div>
          <div class="cta">${dueN > 0 ? 'Review now →' : 'Open flashcards →'}</div>
        </a>
        <a class="tcard mini" href="/messages">
          <div class="n" style="color:var(--primary)">${_svg.chat.replace('<svg ', '<svg width="26" height="26" ')}</div>
          <div class="lbl">practice a real conversation</div>
          <div class="cta">Chat with your tutor →</div>
        </a>
      </div>
      <div class="quick">
        <h3>Quick actions</h3>
        <div class="quick-row">
          <a class="quick-chip" href="/translate">${_svg.pencil} Translate a word</a>
          <a class="quick-chip" href="/reader">${_svg.book} New story</a>
          <a class="quick-chip" href="/browse?tab=community">${_svg.decks} Browse decks</a>
        </div>
      </div>`;
  }

  init();
  document.addEventListener('langchange', init);
</script>
</body>
</html>
