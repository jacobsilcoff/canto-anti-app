<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f8f9fa">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Add Vocab</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <script src="/static/label-picker.js"></script>
  <style>
    /* ── lang direction bar ── */
    .lang-direction {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
    }
    .lang-dir-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 4px 10px;
      border-radius: 6px;
    }
    .lang-dir-label.active { color: var(--text); background: var(--surface); border: 1px solid var(--border); }
    .swap-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 6px;
      color: var(--text-muted);
      border-radius: 6px;
      display: flex;
      align-items: center;
    }
    .swap-btn:hover { background: var(--surface); color: var(--text); }

    /* ── tour overlay ── */
    .tour-overlay {
      position: fixed; inset: 0; z-index: 9000;
      background: var(--overlay);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .tour-card {
      background: var(--surface); border-radius: 16px;
      box-shadow: var(--shadow-pop);
      padding: 32px 28px; max-width: 420px; width: 100%;
      display: flex; flex-direction: column; gap: 16px;
      position: relative;
    }
    .tour-step-num {
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--primary);
    }
    .tour-icon { font-size: 2.4rem; line-height: 1; }
    .tour-title { font-size: 1.2rem; font-weight: 700; color: var(--text); margin: 0; }
    .tour-body { font-size: 0.95rem; color: var(--text-muted); line-height: 1.55; margin: 0; }
    .tour-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 4px; }
    .tour-dots { display: flex; gap: 6px; }
    .tour-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
    .tour-dot.active { background: var(--primary); }
    .tour-next-btn {
      background: var(--primary); color: #fff; border: none; border-radius: 8px;
      padding: 10px 22px; font-size: 0.95rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .tour-next-btn:hover { opacity: 0.9; }
    .tour-skip {
      position: absolute; top: 14px; right: 16px;
      background: none; border: none; cursor: pointer;
      font-size: 1rem; color: var(--text-muted); padding: 4px 8px; border-radius: 6px;
    }
    .tour-skip:hover { background: var(--bg); }

    .candidate-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .candidate-option {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.15s;
    }
    .candidate-option:hover { border-color: var(--primary); }
    .candidate-target { font-size: 1.1rem; font-weight: 500; font-family: var(--script-font, inherit); }
    .candidate-roman { font-size: 0.88rem; color: var(--text-muted); font-style: italic; }
    .candidate-english { font-size: 0.92rem; }
    .candidate-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 600;
    }
    .ai-notes-block {
      background: var(--surface-alt);
      border-left: 3px solid var(--primary);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.88rem;
      color: var(--text);
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .ai-notes-label {
      font-size: 0.7rem;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 700;
      margin-bottom: 2px;
    }
  </style>
</head>
<body>

<header>{{NAV}}</header>

<div id="tour-overlay" class="tour-overlay" style="display:none" aria-modal="true" role="dialog">
  <div class="tour-card">
    <button class="tour-skip" onclick="dismissTour()" title="Skip tour">✕</button>
    <div class="tour-step-num" id="tour-step-num">Step 1 of 3</div>
    <div class="tour-icon" id="tour-icon">✏️</div>
    <h2 class="tour-title" id="tour-title"></h2>
    <p class="tour-body" id="tour-body"></p>
    <div class="tour-footer">
      <div class="tour-dots" id="tour-dots"></div>
      <button class="tour-next-btn" id="tour-next-btn" onclick="tourNext()">Next →</button>
    </div>
  </div>
</div>

<main class="translate-page">
  <div class="lang-direction">
    <span class="lang-dir-label active" id="btn-source">English</span>
    <button class="swap-btn" onclick="swapLang()" title="Swap direction" aria-label="Swap direction">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
    </button>
    <span class="lang-dir-label" id="btn-target"></span>
  </div>

  <!-- Sticky labels picker -->
  <div class="labels-bar">
    <div class="labels-bar-header">
      <span class="labels-bar-title">Labels for next translation</span>
    </div>
    <div id="sticky-label-picker"></div>
  </div>

  <div class="translate-container">
    <div class="input-panel">
      <textarea id="input" placeholder="Enter text…" oninput="onInput()" rows="4"></textarea>
      <div class="input-controls">
        <span class="char-count" id="char-count">0</span>
        <button class="clear-btn" onclick="clearInput()" title="Clear">✕</button>
      </div>
    </div>

    <details class="context-details" id="context-details">
      <summary>
        <span class="context-summary-label">+ Add context for translator</span>
        <span class="context-summary-set" id="context-summary-set" style="display:none">Context set</span>
      </summary>
      <textarea id="context-input" placeholder="e.g. as in charging a phone, not financial" rows="2"
                oninput="onContextInput()"></textarea>
    </details>

    <button class="translate-btn" id="translate-btn" onclick="doTranslate()">Translate</button>

    <!-- Candidate picker (shown when AI returns multiple translations) -->
    <div class="output-panel" id="candidate-panel" style="display:none">
      <div class="ai-notes-label" style="margin-bottom:6px">Did you mean…</div>
      <div class="candidate-list" id="candidate-list"></div>
    </div>

    <!-- Final card output -->
    <div class="output-panel" id="output-panel" style="display:none">
      <div class="output-chinese" id="out-target"></div>
      <div class="output-jyutping" id="out-romanization"></div>
      <div class="output-classifier" id="out-classifier" style="display:none"></div>
      <div class="output-english" id="out-english" style="display:none"></div>

      <div class="output-labels" id="output-labels" style="display:none"></div>

      <div class="ai-notes-block" id="ai-notes-block" style="display:none">
        <div class="ai-notes-label">AI note</div>
        <div id="ai-notes-text"></div>
      </div>

      <details class="output-notes-details" id="output-notes-details">
        <summary>
          <span id="notes-summary-empty">+ Add your own note</span>
          <span id="notes-summary-full" style="display:none">Note saved</span>
        </summary>
        <textarea id="notes-input" placeholder="Optional note for this card…" rows="2"
                  oninput="onNotesInput()"></textarea>
        <div class="notes-actions">
          <button class="edit-save-btn" id="notes-save-btn" onclick="saveNotes()" disabled>Save note</button>
          <span class="notes-saved-msg" id="notes-saved-msg"></span>
        </div>
      </details>

      <div class="output-controls">
        <button class="audio-btn" id="audio-btn" onclick="playAudio()">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
          Play
        </button>
        <span class="saved-indicator" id="saved-indicator">✓ Saved to flashcards</span>
      </div>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
  // ── State ────────────────────────────────────────────────────────────────
  let languages = [];
  let targetLang = 'yue';
  let sourceIsTarget = false;          // false: en → target, true: target → en
  let currentCardId = null;
  let audioEl = null;
  let allLabels = [];
  let stickyPicker = null;
  let savedNotes = '';
  let aiNotes = '';                    // notes returned by AI, automatically saved
  let lastTranslation = null;          // last translate result (with candidates)

  function langByCode(code) {
    return languages.find(l => l.code === code) || null;
  }

  // Tag the page with the target language's writing system so target-text
  // elements (.output-chinese, .candidate-target) use the right font.
  function applyScript(code) {
    const l = langByCode(code);
    const fam = (l && l.script_family) || 'latin';
    document.body.classList.remove('script-chinese', 'script-devanagari', 'script-telugu', 'script-hangul', 'script-latin');
    document.body.classList.add('script-' + fam);
  }

  // ── Language ─────────────────────────────────────────────────────────────
  async function loadLanguages() {
    try {
      const res = await fetch('/api/languages').then(r => r.json());
      languages = res.languages;
    } catch {
      languages = [{ code: 'yue', name: 'Cantonese', flag: '🇭🇰', romanization: 'jyutping', logographic: true }];
    }
    updateDirectionButtons();
  }

  function setDirection(isTarget) {
    sourceIsTarget = isTarget;
    updateDirectionButtons();
    resetOutput();
  }

  function swapLang() {
    setDirection(!sourceIsTarget);
  }

  function updateDirectionButtons() {
    applyScript(targetLang);
    const lang = langByCode(targetLang);
    const langName = lang ? lang.name : targetLang;
    const langLabel = (lang && lang.flag ? lang.flag + ' ' : '') + langName;
    const src = document.getElementById('btn-source');
    const tgt = document.getElementById('btn-target');
    if (src) src.classList.toggle('active', !sourceIsTarget);
    if (tgt) { tgt.classList.toggle('active', sourceIsTarget); tgt.textContent = langLabel; }
    document.getElementById('input').placeholder = sourceIsTarget
      ? `Enter ${langName} text…`
      : 'Enter English text…';
  }

  // ── Tour ─────────────────────────────────────────────────────────────────
  const TOUR_STEPS = [
    {
      icon: '✏️',
      title: 'Type any word to add it',
      body: 'Translate an English word or phrase and it becomes a flashcard in your deck — with audio, romanization, and AI notes included.',
    },
    {
      icon: '🃏',
      title: 'Study your cards daily',
      body: 'The Flashcards tab shows you cards due today. Each card has three faces: recognition, production, and pronunciation — spaced repetition handles the scheduling.',
    },
    {
      icon: '📖',
      title: 'Read real stories',
      body: 'The Reader generates texts in your language. Tap any word to see its translation or add it to your deck. Words you already know are highlighted.',
    },
  ];
  let tourStep = 0;

  function showTour() {
    tourStep = 0;
    renderTourStep();
    document.getElementById('tour-overlay').style.display = 'flex';
  }

  function renderTourStep() {
    const s = TOUR_STEPS[tourStep];
    document.getElementById('tour-step-num').textContent = `Step ${tourStep + 1} of ${TOUR_STEPS.length}`;
    document.getElementById('tour-icon').textContent = s.icon;
    document.getElementById('tour-title').textContent = s.title;
    document.getElementById('tour-body').textContent = s.body;
    const btn = document.getElementById('tour-next-btn');
    btn.textContent = tourStep < TOUR_STEPS.length - 1 ? 'Next →' : 'Got it';
    const dots = document.getElementById('tour-dots');
    dots.innerHTML = '';
    TOUR_STEPS.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'tour-dot' + (i === tourStep ? ' active' : '');
      dots.appendChild(d);
    });
  }

  function tourNext() {
    if (tourStep < TOUR_STEPS.length - 1) {
      tourStep++;
      renderTourStep();
    } else {
      dismissTour();
    }
  }

  async function dismissTour() {
    document.getElementById('tour-overlay').style.display = 'none';
    try { await fetch('/api/tour-seen', { method: 'POST' }); } catch {}
  }

  // ── Input ────────────────────────────────────────────────────────────────
  function onInput() {
    document.getElementById('char-count').textContent = document.getElementById('input').value.length;
  }

  function onContextInput() {
    const has = document.getElementById('context-input').value.trim().length > 0;
    document.getElementById('context-summary-set').style.display = has ? '' : 'none';
    document.querySelector('#context-details .context-summary-label').textContent =
      has ? 'Context for translator' : '+ Add context for translator';
  }

  function onNotesInput() {
    document.getElementById('notes-save-btn').disabled =
      (document.getElementById('notes-input').value === savedNotes);
    document.getElementById('notes-saved-msg').textContent = '';
  }

  function clearInput() {
    document.getElementById('input').value = '';
    document.getElementById('char-count').textContent = '0';
    resetOutput();
  }

  function resetOutput() {
    document.getElementById('candidate-panel').style.display = 'none';
    document.getElementById('output-panel').style.display = 'none';
    document.getElementById('saved-indicator').classList.remove('show');
    document.getElementById('notes-input').value = '';
    document.getElementById('notes-save-btn').disabled = true;
    document.getElementById('notes-saved-msg').textContent = '';
    document.getElementById('output-notes-details').open = false;
    document.getElementById('notes-summary-empty').style.display = '';
    document.getElementById('notes-summary-full').style.display = 'none';
    document.getElementById('ai-notes-block').style.display = 'none';
    savedNotes = '';
    aiNotes = '';
    currentCardId = null;
    lastTranslation = null;
    if (audioEl) { audioEl.pause(); audioEl = null; }
    document.getElementById('audio-btn').classList.remove('playing');
  }

  // ── Labels ───────────────────────────────────────────────────────────────
  async function loadLabels() {
    try {
      const { labels } = await fetch('/api/labels').then(r => r.json());
      allLabels = labels;
    } catch {
      allLabels = [];
    }

    if (stickyPicker) {
      stickyPicker.setLabels(allLabels);
    } else {
      stickyPicker = new LabelPicker(
        document.getElementById('sticky-label-picker'),
        {
          allLabels,
          initialIds: [],
          allowCreate: true,
          mode: 'multi',
          placeholder: 'Search or create a label…',
          onChange: ids => {
            if (currentCardId) syncCurrentCardLabels();
          },
          onLabelsRefreshed: labels => { allLabels = labels; },
        }
      );
    }
  }

  function renderOutputLabels(autoLabels) {
    const el = document.getElementById('output-labels');
    el.innerHTML = '';
    const parts = [];
    if (stickyPicker) {
      const sel = stickyPicker.getSelected();
      allLabels.filter(l => sel.has(l.id)).forEach(lbl => parts.push(lbl.name));
    }
    (autoLabels || []).forEach(name => { if (!parts.includes(name)) parts.push(name); });
    if (parts.length === 0) { el.style.display = 'none'; return; }
    el.style.display = 'flex';
    parts.forEach(name => {
      const chip = document.createElement('span');
      chip.className = 'label-chip-static';
      chip.textContent = name;
      el.appendChild(chip);
    });
  }

  async function syncCurrentCardLabels() {
    if (!currentCardId || !stickyPicker) return;
    await persistCard();
    renderOutputLabels();
  }

  // classifier display in output — stored on lastTranslation

  // ── Notes ────────────────────────────────────────────────────────────────
  async function saveNotes() {
    if (!currentCardId) return;
    const notes = document.getElementById('notes-input').value;
    const btn = document.getElementById('notes-save-btn');
    btn.disabled = true;
    try {
      savedNotes = notes;
      await persistCard();
      document.getElementById('notes-saved-msg').textContent = 'Saved';
      setTimeout(() => { document.getElementById('notes-saved-msg').textContent = ''; }, 2000);
      updateNotesSummary();
    } catch {
      showToast('Could not save note.');
      btn.disabled = false;
    }
  }

  function updateNotesSummary() {
    const has = savedNotes.trim().length > 0;
    document.getElementById('notes-summary-empty').style.display = has ? 'none' : '';
    document.getElementById('notes-summary-full').style.display = has ? '' : 'none';
  }

  function combinedNotes() {
    const parts = [];
    if (aiNotes.trim()) parts.push(aiNotes.trim());
    if (savedNotes.trim()) parts.push(savedNotes.trim());
    return parts.join('\n\n');
  }

  // ── Persist (update card on backend) ─────────────────────────────────────
  async function persistCard() {
    if (!currentCardId) return;
    const target = document.getElementById('out-target').textContent;
    const roman  = document.getElementById('out-romanization').textContent;
    const english = sourceIsTarget
      ? document.getElementById('out-english').textContent
      : document.getElementById('input').value.trim();
    const res = await fetch(`/api/cards/${currentCardId}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        source_text: english,
        target_text: target,
        romanization: roman,
        notes: combinedNotes(),
        label_ids: stickyPicker ? [...stickyPicker.getSelected()] : [],
      }),
    });
    if (!res.ok) throw new Error('persist failed');
  }

  // ── Translate ────────────────────────────────────────────────────────────
  async function doTranslate() {
    const text = document.getElementById('input').value.trim();
    if (!text) return;

    const context = document.getElementById('context-input').value.trim();
    const btn = document.getElementById('translate-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>';
    resetOutput();

    try {
      const res = await fetch('/api/translate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          text,
          target_lang: targetLang,
          source_is_target: sourceIsTarget,
          context: context || null,
        }),
      });
      if (!res.ok) {
        let msg = 'Translation failed — please try again.';
        try { msg = (await res.json()).detail || msg; } catch {}
        throw new Error(msg);
      }
      lastTranslation = await res.json();

      if ((lastTranslation.candidates || []).length > 1) {
        renderCandidates(lastTranslation.candidates);
      } else if (lastTranslation.candidates && lastTranslation.candidates.length === 1) {
        await chooseCandidate(0);
      } else {
        showToast('No translation returned.');
      }
    } catch (e) {
      showToast(e.message || 'Translation failed — please try again.');
      console.error(e);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Translate';
    }
  }

  function renderCandidates(candidates) {
    const panel = document.getElementById('candidate-panel');
    const list = document.getElementById('candidate-list');
    list.innerHTML = '';
    const lang = langByCode(targetLang);
    candidates.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'candidate-option';
      row.onclick = () => chooseCandidate(i);
      const inner = document.createElement('div');
      if (c.label) {
        const lbl = document.createElement('div');
        lbl.className = 'candidate-label';
        lbl.textContent = c.label;
        row.appendChild(lbl);
      }
      const tgt = document.createElement('div');
      tgt.className = 'candidate-target';
      tgt.textContent = c.target_text;
      row.appendChild(tgt);
      if (c.romanization && lang && lang.logographic) {
        const r = document.createElement('div');
        r.className = 'candidate-roman';
        r.textContent = c.romanization;
        row.appendChild(r);
      }
      const en = document.createElement('div');
      en.className = 'candidate-english';
      en.textContent = c.english;
      row.appendChild(en);
      list.appendChild(row);
    });
    panel.style.display = 'block';
  }

  async function chooseCandidate(index) {
    if (!lastTranslation) return;
    const c = lastTranslation.candidates[index];
    aiNotes = c.notes || '';
    savedNotes = '';

    document.getElementById('candidate-panel').style.display = 'none';
    document.getElementById('translate-btn').disabled = true;
    document.getElementById('translate-btn').innerHTML = '<span class="spinner"></span>';

    try {
      const res = await fetch('/api/cards', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          source_text: c.english,
          target_text: c.target_text,
          romanization: c.romanization || '',
          target_lang: targetLang,
          notes: aiNotes || null,
          priority: lastTranslation.priority || 3,
          label_ids: stickyPicker ? [...stickyPicker.getSelected()] : [],
          suggested_labels: lastTranslation.suggested_labels || [],
          classifier: lastTranslation.classifier || '',
          cefr_level: lastTranslation.cefr_level || null,
        }),
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      currentCardId = data.card_id;
      renderResult(c, lastTranslation.suggested_labels || []);
    } catch {
      showToast('Could not save card — try again.');
    } finally {
      document.getElementById('translate-btn').disabled = false;
      document.getElementById('translate-btn').textContent = 'Translate';
    }
  }

  function renderResult(c, autoLabels) {
    const lang = langByCode(targetLang);
    document.getElementById('out-target').textContent = c.target_text;
    document.getElementById('out-romanization').textContent =
      (lang && lang.logographic) ? (c.romanization || '') : '';
    document.getElementById('out-romanization').style.display =
      (lang && lang.logographic && c.romanization) ? '' : 'none';

    const classifierEl = document.getElementById('out-classifier');
    const classifier = lastTranslation ? (lastTranslation.classifier || '') : '';
    if (classifier) {
      classifierEl.textContent = classifier;
      classifierEl.style.display = '';
    } else {
      classifierEl.style.display = 'none';
    }

    const englishEl = document.getElementById('out-english');
    if (sourceIsTarget) {
      englishEl.textContent = c.english;
      englishEl.style.display = 'block';
    } else {
      englishEl.textContent = '';
      englishEl.style.display = 'none';
    }

    // AI notes
    if (aiNotes && aiNotes.trim()) {
      document.getElementById('ai-notes-text').textContent = aiNotes.trim();
      document.getElementById('ai-notes-block').style.display = '';
    } else {
      document.getElementById('ai-notes-block').style.display = 'none';
    }

    renderOutputLabels(autoLabels || []);
    document.getElementById('output-panel').style.display = 'block';

    const ind = document.getElementById('saved-indicator');
    ind.classList.add('show');
    setTimeout(() => ind.classList.remove('show'), 3000);

    if (audioEl) { audioEl.pause(); audioEl = null; }
    document.getElementById('audio-btn').classList.remove('playing');
  }

  // ── Audio ────────────────────────────────────────────────────────────────
  function playAudio() {
    if (!currentCardId) return;
    if (audioEl && !audioEl.paused) {
      audioEl.pause();
      document.getElementById('audio-btn').classList.remove('playing');
      return;
    }
    audioEl = new Audio(`/api/audio/${currentCardId}`);
    audioEl.play();
    document.getElementById('audio-btn').classList.add('playing');
    audioEl.onended = () => document.getElementById('audio-btn').classList.remove('playing');
  }

  // ── Misc ─────────────────────────────────────────────────────────────────
  async function loadDueCount() {
    try {
      const { count } = await fetch('/api/cards/due-count').then(r => r.json());
      if (count > 0) {
        document.querySelectorAll('.due-badge').forEach(b => {
          b.textContent = count; b.classList.add('visible');
        });
      }
    } catch {}
  }


  async function loadStreak() {
    try {
      const { streak, points } = await fetch('/api/streak').then(r => r.json());
      const parts = [];
      if (streak > 0) parts.push(`🔥 ${streak}`);
      if (points > 0) parts.push(`⭐ ${points}`);
      if (parts.length) {
        document.querySelectorAll('.streak-display').forEach(el => {
          el.textContent = parts.join(' · ');
          el.style.display = '';
        });
      }
    } catch {}
  }

  function toggleMobileMenu() {
    document.getElementById('nav-dropdown').classList.toggle('open');
  }

  async function loadSettings() {
    try {
      const s = await fetch('/api/settings').then(r => r.json());
      if (s.default_target_lang) targetLang = s.default_target_lang;
      updateDirectionButtons();
      if (!s.tour_seen) showTour();
    } catch {}
  }

  async function doLogout() {
    try {
      await fetch('/api/logout', { method: 'POST' });
    } catch {}
    window.location.replace('/login');
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 4000);
  }

  document.addEventListener('click', e => {
    if (!e.target.closest('header')) {
      const dd = document.getElementById('nav-dropdown');
      if (dd) dd.classList.remove('open');
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      const overlay = document.getElementById('tour-overlay');
      if (overlay && overlay.style.display !== 'none') { dismissTour(); return; }
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      doTranslate();
    }
  });

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  }

  (async () => {
    await loadLanguages();
    await Promise.all([loadSettings(), loadDueCount(), loadLabels(), loadStreak()]);
  })();
</script>
</body>
</html>
