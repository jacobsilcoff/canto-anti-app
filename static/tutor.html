<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f5f4ef">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Tutor</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Sans+Thai:wght@400;500&family=Noto+Sans+Hebrew:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/pages/tutor.css">
</head>
<body>

<header>{{NAV}}</header>

<main>
  <div class="tutor-page">
    <div class="tutor-top">
      <a class="tutor-back" href="/messages" title="Back to chats" aria-label="Back to chats">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <button class="chats-btn" id="chats-btn" title="Your conversations">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="cb-title" id="current-chat-title">New chat</span> <span class="cb-chevron">▾</span>
      </button>
      <button class="new-chat-btn" id="new-chat-btn" title="New conversation">＋</button>
      <span class="tutor-points" id="tutor-points" style="display:none"></span>
    </div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <textarea id="composer-input" rows="1" placeholder="Say something…" enterkeyhint="send"></textarea>
      <button id="composer-send" title="Send" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
    </div>
  </div>
</main>

<!-- Conversations drawer -->
<div class="chats-drawer" id="chats-drawer">
  <div class="chats-scrim" id="chats-scrim"></div>
  <div class="chats-panel">
    <div class="chats-head">
      <h3>Conversations</h3>
      <button class="chats-close" id="chats-close" title="Close">✕</button>
    </div>
    <button class="chats-new" id="chats-new">＋ New chat</button>
    <div class="chats-list" id="chats-list"></div>
  </div>
</div>
<div class="pt-toast" id="pt-toast"></div>
<div id="gl-tip" aria-hidden="true"></div>

<script src="/static/pages/tutor.js"></script>
</body>
</html>
