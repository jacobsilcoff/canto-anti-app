<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f8f9fa">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Tutor</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&family=Noto+Sans+KR:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* ChatGPT-style fixed chat: the page itself never scrolls — the thread is
       the ONLY scroller and the composer stays pinned above the keyboard.
       html/body are locked to the viewport; a visualViewport handler keeps the
       body height in sync when the mobile keyboard opens (iOS doesn't resize
       the layout viewport on its own). */
    html { height: 100%; overflow: hidden; }
    /* body is position:fixed so the browser physically cannot scroll the page —
       this is what stops iOS from scrolling up to "reveal the caret" on every
       keystroke (which made the composer flash above the keyboard). The JS only
       keeps the body HEIGHT synced to the visible viewport. */
    /* min-height:0 is critical — the global `body { min-height:100dvh }` would
       otherwise floor the body at full height (dvh does NOT shrink for the
       keyboard), so the JS-set height couldn't compress the chat above it. */
    body { position: fixed; top: 0; left: 0; right: 0; height: 100dvh; min-height: 0; overflow: hidden; overscroll-behavior: none; }
    main { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .tutor-page { max-width: 720px; margin: 0 auto; padding: 8px 14px 0; flex: 1; min-height: 0; display: flex; flex-direction: column; width: 100%; }

    /* Top bar: current chat + new chat + points */
    .tutor-top { display: flex; align-items: center; gap: 8px; padding: 4px 0 8px; flex-shrink: 0; }
    .chats-btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 5px 12px; font-size: 0.85rem; cursor: pointer; color: var(--text); flex: 1; min-width: 0; max-width: 100%; }
    .chats-btn .cb-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; text-align: left; }
    .chats-btn .cb-chevron { color: var(--text-muted); flex-shrink: 0; }
    .new-chat-btn { border: 1px solid var(--border); background: var(--surface); color: var(--primary); border-radius: 999px; width: 32px; height: 32px; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; line-height: 1; }
    .new-chat-btn:hover { border-color: var(--primary); }
    .tutor-points { font-size: 0.85rem; font-weight: 700; color: var(--text); background: var(--bg); border-radius: 999px; padding: 5px 11px; flex-shrink: 0; transition: transform 0.15s; }
    .tutor-points.bump { transform: scale(1.25); }

    /* Conversations drawer (slides in from the left; full-height list) */
    .chats-drawer { position: fixed; inset: 0; z-index: 500; display: none; }
    .chats-drawer.open { display: block; }
    .chats-scrim { position: absolute; inset: 0; background: var(--overlay); }
    .chats-panel { position: absolute; top: 0; left: 0; bottom: 0; width: min(340px, 86vw); background: var(--surface); box-shadow: var(--shadow-pop); display: flex; flex-direction: column; transform: translateX(-100%); transition: transform 0.2s ease; }
    .chats-drawer.open .chats-panel { transform: translateX(0); }
    .chats-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 12px; border-bottom: 1px solid var(--border); }
    .chats-head h3 { font-size: 1rem; font-weight: 700; margin: 0; }
    .chats-close { background: none; border: none; font-size: 1.3rem; cursor: pointer; color: var(--text-muted); line-height: 1; padding: 2px 6px; }
    .chats-new { margin: 12px 14px 6px; padding: 10px; border: 1px solid var(--primary); background: var(--primary-soft); color: var(--primary); border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .chats-list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 10px 16px; scrollbar-width: none; -ms-overflow-style: none; }
    .chats-list::-webkit-scrollbar { width: 0; height: 0; }
    .chats-empty { color: var(--text-muted); font-size: 0.88rem; text-align: center; padding: 24px 16px; }
    .chat-row { display: flex; align-items: center; gap: 8px; padding: 10px 10px; border-radius: 10px; cursor: pointer; }
    .chat-row:hover { background: var(--surface-alt); }
    .chat-row.active { background: var(--primary-soft); }
    .chat-row-main { flex: 1; min-width: 0; }
    .chat-row-title { font-size: 0.92rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-row.active .chat-row-title { color: var(--primary); font-weight: 600; }
    .chat-row-time { font-size: 0.74rem; color: var(--text-muted); margin-top: 2px; }
    .chat-del { background: none; border: none; cursor: pointer; color: var(--text-faint); font-size: 0.95rem; padding: 6px; border-radius: 6px; flex-shrink: 0; }
    .chat-del:hover { color: var(--danger); background: var(--danger-soft); }

    /* Thread (the only scrolling region) */
    .thread { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; display: flex; flex-direction: column; gap: 12px; padding: 6px 2px 16px; scrollbar-width: none; -ms-overflow-style: none; }
    .thread::-webkit-scrollbar { width: 0; height: 0; }
    .bubble { max-width: 86%; border-radius: 16px; padding: 10px 14px; line-height: 1.55; font-size: 1rem; position: relative; word-break: break-word; }
    .bubble.user { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 5px; font-family: var(--script-font, inherit); }
    .bubble.tutor { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 5px; }
    .bubble.system { align-self: center; background: none; border: 1px dashed var(--border); color: var(--text-muted); font-size: 0.85rem; max-width: 94%; text-align: center; }
    /* Reserve room for jyutping ruby ALWAYS, so toggling あ on/off (or ruby
       loading in) never changes the bubble height / re-spaces the text. */
    .bubble-reply { font-family: var(--script-font, inherit); font-size: 1.05rem; line-height: 2.05; }
    .bubble-reply ruby { line-height: 1; }
    .corr-fixed, .ni-word { line-height: 2.0; }
    .corr-fixed ruby, .ni-word ruby { line-height: 1; }
    .bubble-en { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border); color: var(--text-muted); font-size: 0.9rem; line-height: 1.45; }
    .bubble-empty { color: var(--text-muted); font-size: 0.9rem; font-style: italic; }
    ruby { ruby-align: center; }
    rt { font-size: 0.62em; color: var(--text-muted); font-family: inherit; font-style: normal; }
    .bubble.user rt { color: rgba(255,255,255,0.8); }
    .gl { cursor: help; border-bottom: 1px dotted var(--text-muted); outline: none; }

    /* Per-bubble tool buttons (icon-only, reader-style あ with strike when off) */
    .bubble-tools { display: flex; gap: 6px; margin-top: 8px; align-items: center; }
    .tool-btn { border: 1px solid var(--border); background: var(--surface); cursor: pointer; color: var(--text-muted); width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.82rem; padding: 0; line-height: 1; position: relative; flex-shrink: 0; }
    .tool-btn:hover { color: var(--primary); border-color: var(--primary); }
    .tool-btn.on { color: var(--primary); border-color: var(--primary); background: var(--primary-soft); }
    .rom-toggle-off::after { content: ''; position: absolute; left: 50%; top: 50%; width: 60%; height: 1.5px; background: currentColor; transform: translate(-50%, -50%) rotate(-45deg); opacity: 0.7; pointer-events: none; }
    .drill-btn { border: 1px solid var(--border); background: var(--surface); color: var(--text-muted); border-radius: 999px; padding: 0 12px; height: 30px; font-size: 0.78rem; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .drill-btn:hover { color: var(--primary); border-color: var(--primary); }
    .drill-btn:disabled { opacity: 0.5; cursor: default; }

    /* Drill sub-session — a self-contained, collapsible panel set apart from the
       chat. Ended drills collapse to just their header. */
    /* flex-shrink:0 is load-bearing: overflow:hidden gives a flex item an automatic
       min-height of 0, so without this the panel would COMPRESS to fit the thread
       and clip its content (overflow:hidden) — the bottom of a long drill becomes
       unreachable and the thread can't scroll to it. Pinning the height keeps the
       whole drill in flow so the thread scrolls normally. */
    .drill-panel { align-self: stretch; flex-shrink: 0; border: 1px solid var(--grammar-border, var(--border)); border-radius: 14px; overflow: hidden; background: var(--surface); }
    .drill-head { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; background: var(--grammar-soft, var(--primary-soft)); color: var(--grammar-strong, var(--primary)); font-weight: 700; font-size: 0.82rem; user-select: none; }
    .drill-head-title { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .drill-head-count { font-weight: 500; opacity: 0.8; }
    .drill-chev { transition: transform 0.15s; font-size: 0.7rem; }
    .drill-panel.collapsed .drill-chev { transform: rotate(-90deg); }
    .drill-panel.collapsed .drill-body { display: none; }
    .drill-end { background: var(--surface); color: var(--grammar-strong, var(--primary)); border: 1px solid currentColor; border-radius: 999px; padding: 3px 11px; font-size: 0.74rem; font-weight: 700; cursor: pointer; flex-shrink: 0; }
    .drill-end:hover { background: var(--grammar-strong, var(--primary)); color: var(--on-primary, #fff); }
    .drill-end:disabled { opacity: 0.5; cursor: default; }
    .drill-body { display: flex; flex-direction: column; gap: 12px; padding: 12px; }
    .drill-body .bubble { max-width: 92%; }

    .mini-speak { background: none; border: none; cursor: pointer; font-size: 0.85rem; padding: 2px 4px; color: var(--text-muted); flex-shrink: 0; line-height: 1; }
    .mini-speak:hover { color: var(--primary); }

    /* Collapsible extras (corrections / new-word suggestions) */
    .xtra { margin-top: 8px; border-top: 1px dashed var(--border); }
    .xtra-head { display: flex; align-items: center; gap: 6px; width: 100%; background: none; border: none; cursor: pointer; color: var(--text-muted); font-size: 0.78rem; font-weight: 600; padding: 7px 0 3px; text-align: left; }
    .xtra-chev { margin-left: auto; transition: transform 0.15s; font-size: 0.7rem; }
    .xtra.open .xtra-chev { transform: rotate(180deg); }
    .xtra:not(.open) .xtra-body { display: none; }

    /* Corrections — attached UNDER the learner's own message (right-aligned),
       since a correction is about what they just said. The toggle is a compact
       amber pill that hugs the right edge (next to the learner's bubble), not a
       full-width row with the label stranded on the far left. */
    .corr-wrap { align-self: flex-end; max-width: 86%; width: 100%; }
    .corr-wrap .xtra { border-top: none; margin-top: 2px; display: flex; flex-direction: column; align-items: flex-end; }
    .corr-wrap .xtra-head {
      width: auto; gap: 5px; padding: 4px 11px; border-radius: 999px;
      background: var(--warn-soft, #fffbeb); border: 1px solid var(--warn-border, #fde68a);
      color: var(--warn-strong, #b45309);
    }
    .corr-wrap .xtra-head .xtra-chev { margin-left: 1px; }
    .corr-wrap .xtra-body { width: 100%; }
    .corr-card { margin-top: 6px; background: var(--warn-soft, #fffbeb); border: 1px solid var(--warn-border, #fde68a); border-left: 3px solid var(--warn-strong, #f59e0b); border-radius: 10px; padding: 8px 11px; font-size: 0.88rem; }
    .corr-quote { color: var(--text-muted); text-decoration: line-through; font-family: var(--script-font, inherit); }
    .corr-fixed { font-weight: 600; font-family: var(--script-font, inherit); font-size: 1rem; margin-top: 2px; display: flex; align-items: center; gap: 8px; }
    .corr-form { margin-top: 4px; display: inline-block; font-size: 0.74rem; font-weight: 600; color: var(--grammar-strong, var(--primary)); background: var(--grammar-soft, var(--primary-soft)); border-radius: 999px; padding: 2px 9px; }
    .corr-why { color: var(--text-muted); margin-top: 4px; font-size: 0.82rem; }

    /* "New word" chips inside a tutor bubble */
    .ni-list { display: flex; flex-direction: column; gap: 6px; padding: 2px 0 4px; }
    .ni-chip { display: flex; align-items: center; gap: 8px; background: var(--surface-alt, #f7f8fc); border: 1px solid var(--border); border-radius: 10px; padding: 7px 9px 7px 11px; }
    .ni-word { font-family: var(--script-font, inherit); font-size: 1.05rem; }
    .ni-rom { color: var(--text-muted); font-size: 0.74rem; font-style: italic; }
    .ni-gloss { color: var(--text-muted); font-size: 0.84rem; flex: 1; min-width: 0; }
    .ni-notes { color: var(--text-muted); font-size: 0.78rem; margin-top: 2px; font-style: italic; }
    .ni-add { background: none; border: 1px solid var(--primary); color: var(--primary); border-radius: 999px; padding: 3px 10px; font-size: 0.76rem; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .ni-add:disabled { opacity: 0.6; cursor: default; }
    .ni-in-deck { color: var(--good); font-size: 0.74rem; font-weight: 600; flex-shrink: 0; }
    .ni-x { background: none; border: none; cursor: pointer; color: var(--text-faint); font-size: 0.85rem; padding: 4px 6px; border-radius: 6px; flex-shrink: 0; line-height: 1; }
    .ni-x:hover { color: var(--danger); background: var(--danger-soft); }

    /* Typing indicator */
    .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
    .typing span { width: 7px; height: 7px; border-radius: 50%; background: var(--text-muted); opacity: 0.4; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%,80%,100% { opacity: 0.25; } 40% { opacity: 0.9; } }

    /* Composer (pinned to the bottom; safe-area aware) */
    .composer { flex-shrink: 0; background: var(--bg); padding: 8px 0 calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; align-items: flex-end; }
    /* When the keyboard is up the home-indicator safe area is covered by the
       keyboard, so that extra bottom padding just shows as a gap — drop it so the
       composer sits snug on top of the keyboard. (body.kb-open set in JS.) */
    body.kb-open .composer { padding-bottom: 8px; }
    /* min-height:0 overrides the global `textarea { min-height:120px }` (and the
       150px media-query rule) — otherwise scrollHeight is floored at 120px and the
       auto-grow can never shrink the box back to a single line. */
    .composer textarea { flex: 1; resize: none; border: 1.5px solid var(--border); border-radius: 18px; padding: 11px 14px; font-size: 1rem; font-family: var(--script-font, inherit); background: var(--surface); color: var(--text); min-height: 0; max-height: 110px; line-height: 1.4; box-sizing: border-box; scrollbar-width: none; -ms-overflow-style: none; }
    .composer textarea::-webkit-scrollbar { width: 0; height: 0; }
    .composer textarea:focus { outline: none; border-color: var(--primary); }
    .composer button { background: var(--primary); color: #fff; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 1.1rem; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .composer button:disabled { opacity: 0.5; cursor: default; }

    /* Points toast */
    .pt-toast { position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%); background: var(--tooltip-bg); color: #fff; border-radius: 999px; padding: 8px 16px; font-size: 0.88rem; font-weight: 600; box-shadow: var(--shadow); z-index: 999; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; }
    .pt-toast.show { opacity: 1; transform: translateX(-50%) translateY(-6px); }

    /* Shared gloss tooltip (same mechanism as learn.html) */
    #gl-tip { display: none; position: fixed; z-index: 1000; pointer-events: none;
      background: var(--tooltip-bg); color: #fff; font-size: 0.72rem; line-height: 1.4;
      font-style: normal; font-weight: 400; padding: 4px 9px; border-radius: 6px;
      box-shadow: var(--shadow); max-width: 220px; word-break: break-word; }

    @media (max-width: 600px) {
      .tutor-page { padding: 6px 10px 0; }
      .bubble { max-width: 92%; }
      .composer { padding-top: 6px; }
    }
  </style>
</head>
<body>

<header>{{NAV}}</header>

<main>
  <div class="tutor-page">
    <div class="tutor-top">
      <button class="chats-btn" id="chats-btn" title="Your conversations">
        💬 <span class="cb-title" id="current-chat-title">New chat</span> <span class="cb-chevron">▾</span>
      </button>
      <button class="new-chat-btn" id="new-chat-btn" title="New conversation">＋</button>
      <span class="tutor-points" id="tutor-points" style="display:none"></span>
    </div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <textarea id="composer-input" rows="1" placeholder="Say something…" enterkeyhint="send"></textarea>
      <button id="composer-send" title="Send" disabled>➤</button>
    </div>
  </div>
</main>

<!-- Conversations drawer -->
<div class="chats-drawer" id="chats-drawer">
  <div class="chats-scrim" id="chats-scrim"></div>
  <div class="chats-panel">
    <div class="chats-head">
      <h3>Conversations</h3>
      <button class="chats-close" id="chats-close" title="Close">✕</button>
    </div>
    <button class="chats-new" id="chats-new">＋ New chat</button>
    <div class="chats-list" id="chats-list"></div>
  </div>
</div>
<div class="pt-toast" id="pt-toast"></div>
<div id="gl-tip" aria-hidden="true"></div>

<script>
  let LANGS = [];
  let lang = 'yue';
  let langName = 'your language';
  let conversations = [];
  let currentConv = null;       // conversation id or null (created on first send)
  let pointsTotal = 0;
  let sending = false;
  let activeDrill = null;       // { id, skill, panel, body } while a drill is in progress
  let rubyDefault = localStorage.getItem('tutor_ruby_inline') !== '0';   // default ON

  function esc(s) { const d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; }
  function scriptClassFor(code) { const l = LANGS.find(x => x.code === code); return 'script-' + ((l && l.script_family) || 'latin'); }

  // ── Ruby helpers ─────────────────────────────────────────────────────────────
  const RUBY_LANGS = new Set(['yue', 'cmn', 'ko', 'hi', 'te']);
  function needsRuby(l) { return RUBY_LANGS.has(l); }

  // Token cache (lang+text → [{text, roman, is_word}]) filled by ONE batched
  // request per render — per-bubble GET /api/ruby was N round-trips and made
  // opening a conversation visibly slow.
  const _tokenCache = {};
  function _ck(t) { return lang + '\0' + t; }
  async function fetchTokensBatch(texts) {
    if (!texts.length) return;
    try {
      const res = await fetch('/api/ruby/batch', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ texts, lang }),
      });
      const results = (await res.json()).results || {};
      texts.forEach(t => { _tokenCache[_ck(t)] = results[t] || []; });
    } catch {
      texts.forEach(t => { if (!(_ck(t) in _tokenCache)) _tokenCache[_ck(t)] = []; });
    }
  }

  // Per-token HTML. Inline ruby when the bubble has it on; the tap/hover
  // tooltip shows the English gloss ONLY (romanization already lives in the
  // ruby — no redundant second way to see it).
  function _tokensToHtml(tokens, glossary, showRuby) {
    if (!Array.isArray(tokens) || !tokens.length) return '';
    const hasRoman = tokens.some(t => t.roman);
    return tokens.map(t => {
      const inner = (showRuby && hasRoman && t.is_word && t.roman)
        ? `<ruby>${esc(t.text)}<rt>${esc(t.roman)}</rt></ruby>` : esc(t.text);
      const g = t.is_word ? (glossary || {})[t.text] : null;
      return g ? `<span class="gl" tabindex="0" data-gloss="${esc(g)}">${inner}</span>` : inner;
    }).join('');
  }

  // Paint every .rb span in a bubble from the token cache (sync — cache must
  // already be filled). Re-runs cheaply when the bubble's あ toggle flips.
  function paintRuby(b) {
    b.querySelectorAll('.rb').forEach(s => {
      const tokens = _tokenCache[_ck(s.dataset.text)];
      if (!tokens || !tokens.length) { s.textContent = s.dataset.text; return; }
      const gloss = ('glossed' in s.dataset) ? (b._gloss || {}) : null;
      s.innerHTML = _tokensToHtml(tokens, gloss, b._ruby !== false);
    });
  }

  async function renderRubyAll(bubbles) {
    const needed = new Set();
    bubbles.forEach(b => b.querySelectorAll('.rb').forEach(s => {
      if (!(_ck(s.dataset.text) in _tokenCache)) needed.add(s.dataset.text);
    }));
    await fetchTokensBatch([...needed]);
    bubbles.forEach(paintRuby);
  }

  function rbSpan(text, glossed) {
    if (!text) return '';
    return `<span class="rb" data-text="${esc(text)}"${glossed ? ' data-glossed="1"' : ''}>${esc(text)}</span>`;
  }
  function targetSpan(text) {
    if (!text) return '';
    return needsRuby(lang) ? rbSpan(text) : esc(text);
  }

  function cleanForTTS(text, l) {
    let t = (text || '').replace(/\([^)]*\)/g, '').replace(/\*+/g, '').trim();
    if (RUBY_LANGS.has(l)) {
      const m = t.match(/^([\s\S]*[ऀ-෿ఀ-౿　-鿿가-힯㐀-䶿。！？、，；：“”‘’「」【】〔〕《》·…—～]+)/);
      if (m) t = m[1].trim();
    }
    return t;
  }
  let _audio = null;
  function playTTS(text, l) {
    if (!text) return;
    try { if (_audio) { _audio.pause(); _audio.currentTime = 0; } } catch {}
    _audio = new Audio('/api/tts?text=' + encodeURIComponent(text) + '&lang=' + encodeURIComponent(l));
    _audio.play().catch(() => {});
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  async function init() {
    let latest = null;
    try {
      const [langs, convRes] = await Promise.all([
        fetch('/api/languages').then(r => r.json()).catch(() => ({ languages: [] })),
        fetch('/api/tutor/conversations').then(r => r.json()),
      ]);
      LANGS = langs.languages || [];
      lang = convRes.lang || 'yue';
      const l = LANGS.find(x => x.code === lang);
      langName = l ? l.name : lang;
      conversations = convRes.conversations || [];
      latest = convRes.latest || null;
      setPoints(convRes.points || 0);
    } catch {}
    document.getElementById('thread').className = 'thread ' + scriptClassFor(lang);
    document.querySelector('.composer textarea').classList.add(scriptClassFor(lang));
    updateCurrentTitle();
    if (conversations.length) {
      // The list response already carries the newest conversation's messages —
      // render straight away instead of a second round trip.
      if (latest && latest.id === conversations[0].id) {
        currentConv = latest.id;
        updateCurrentTitle();
        renderMessages(latest.messages || [], latest.active_drill_id);
      } else {
        openConversation(conversations[0].id);
      }
    } else {
      renderWelcome();
    }
    loadStreak();
  }

  function setPoints(n, bump) {
    pointsTotal = n;
    const el = document.getElementById('tutor-points');
    el.innerHTML = `<svg style="display:inline-block;vertical-align:-0.15em" viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path fill="#f0b429" d="M10 1l2.2 6.8H19l-5.6 4.1 2.1 6.6L10 14.4l-5.5 4.1 2.1-6.6L1 7.8h6.8z"/></svg> ${n}`;
    el.style.display = n > 0 ? '' : 'none';
    if (bump) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }
  }

  // ── Conversations (header button + drawer) ───────────────────────────────────
  function _relTime(iso) {
    if (!iso) return '';
    // Server sends UTC 'YYYY-MM-DD HH:MM:SS' (SQLite); local bumps use ISO.
    let t = Date.parse(iso);
    if (isNaN(t)) t = Date.parse(iso.replace(' ', 'T') + 'Z');
    if (isNaN(t)) return '';
    const s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    if (s < 604800) return Math.floor(s / 86400) + 'd ago';
    return new Date(t).toLocaleDateString();
  }

  function updateCurrentTitle() {
    const c = conversations.find(x => x.id === currentConv);
    document.getElementById('current-chat-title').textContent =
      (c && c.title) ? c.title : 'New chat';
  }

  function renderChatsList() {
    const list = document.getElementById('chats-list');
    list.innerHTML = '';
    if (!conversations.length) {
      list.innerHTML = '<div class="chats-empty">No conversations yet.<br>Start chatting below!</div>';
      return;
    }
    conversations.forEach(c => {
      const row = document.createElement('div');
      row.className = 'chat-row' + (c.id === currentConv ? ' active' : '');
      row.innerHTML = `<div class="chat-row-main">
          <div class="chat-row-title">${esc(c.title || 'New chat')}</div>
          <div class="chat-row-time">${esc(_relTime(c.updated_at || c.created_at))}</div>
        </div>
        <button class="chat-del" title="Delete">🗑</button>`;
      row.querySelector('.chat-row-main').onclick = () => {
        closeChats();
        if (c.id !== currentConv) openConversation(c.id);
      };
      row.querySelector('.chat-del').onclick = e => { e.stopPropagation(); deleteConversation(c.id); };
      list.appendChild(row);
    });
  }

  function openChats() {
    renderChatsList();
    document.getElementById('chats-drawer').classList.add('open');
  }
  function closeChats() {
    document.getElementById('chats-drawer').classList.remove('open');
  }
  document.getElementById('chats-btn').onclick = openChats;
  document.getElementById('new-chat-btn').onclick = newConversation;
  document.getElementById('chats-close').onclick = closeChats;
  document.getElementById('chats-scrim').onclick = closeChats;
  document.getElementById('chats-new').onclick = newConversation;
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeChats(); });

  async function newConversation() {
    closeChats();
    _openGen++;                    // invalidate any in-flight conversation load
    currentConv = null;
    updateCurrentTitle();
    renderWelcome();
    document.getElementById('composer-input').focus();
  }

  async function deleteConversation(id) {
    if (!confirm('Delete this conversation?')) return;
    await fetch('/api/tutor/conversations/' + id, { method: 'DELETE' }).catch(() => {});
    conversations = conversations.filter(c => c.id !== id);
    if (currentConv === id) { _openGen++; currentConv = null; renderWelcome(); }
    updateCurrentTitle();
    renderChatsList();
  }

  // Generation guard: clicking between chats quickly used to interleave both
  // fetches into the thread (conversations rendered one after the other).
  let _openGen = 0;
  async function openConversation(id) {
    const gen = ++_openGen;
    currentConv = id;
    updateCurrentTitle();
    document.getElementById('thread').innerHTML = '';
    try {
      const conv = await fetch('/api/tutor/conversations/' + id).then(r => r.json());
      if (gen !== _openGen) return;          // user moved on — drop this render
      renderMessages(conv.messages || [], conv.active_drill_id);
    } catch {}
  }

  function renderMessages(messages, activeDrillId = null) {
    const thread = document.getElementById('thread');
    thread.innerHTML = '';
    clearDrillUI();
    const rubyEls = [];
    let lastUser = null;
    let curDrill = null;   // { id, body }
    messages.forEach(m => {
      // Group consecutive messages sharing a drill_id into one collapsible panel.
      if (m.drill_id) {
        if (!curDrill || curDrill.id !== m.drill_id) {
          const active = (m.drill_id === activeDrillId);
          const { panel, body } = createDrillPanel(m.drill_skill, m.drill_id, active);
          curDrill = { id: m.drill_id, body };
          if (active) setDrillActive(m.drill_skill, m.drill_id, panel, body);
        }
      } else {
        curDrill = null;
      }
      const target = curDrill ? curDrill.body : null;
      const b = appendMessage(m, false, target);
      if (m.role === 'user') lastUser = b;
      if (m.role === 'tutor') {
        rubyEls.push(b);
        const cw = renderCorrections(lastUser, m.corrections, false);   // history: collapsed
        if (cw) rubyEls.push(cw);
      }
    });
    scrollThread();
    renderRubyAll(rubyEls).then(scrollThread);
    markInDeck(thread);
  }

  function renderWelcome() {
    const thread = document.getElementById('thread');
    thread.innerHTML = '';
    clearDrillUI();
    const b = document.createElement('div');
    b.className = 'bubble system';
    b.innerHTML = `👋 I'm your ${esc(langName)} tutor. Talk to me in ${esc(langName)} as much as
      you can — I'll keep the conversation going, fix slips gently, and teach you new
      words you can save to your flashcards. Don't worry about mistakes: if you don't
      know a word, talk around it! Earn <svg style="display:inline-block;vertical-align:-0.15em" viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path fill="#f0b429" d="M10 1l2.2 6.8H19l-5.6 4.1 2.1 6.6L10 14.4l-5.5 4.1 2.1-6.6L1 7.8h6.8z"/></svg> by using what you've learned.`;
    thread.appendChild(b);
  }

  // ── Messages ─────────────────────────────────────────────────────────────────
  function scrollThread() {
    const t = document.getElementById('thread');
    t.scrollTop = t.scrollHeight;
  }

  // Collapsible section inside a tutor bubble (corrections / new words).
  // Fresh messages start open; history loads collapsed to keep the thread tidy.
  function collapsible(label, count, body, startOpen) {
    const wrap = document.createElement('div');
    wrap.className = 'xtra' + (startOpen ? ' open' : '');
    const head = document.createElement('button');
    head.className = 'xtra-head';
    head.type = 'button';
    head.innerHTML = `${label} · ${count} <span class="xtra-chev">▾</span>`;
    head.onclick = () => wrap.classList.toggle('open');
    body.classList.add('xtra-body');
    wrap.appendChild(head);
    wrap.appendChild(body);
    return wrap;
  }

  // Corrections live UNDER the learner's message (right-aligned), inserted as a
  // sibling right after the user bubble they critique.
  function renderCorrections(afterBubble, corrections, startOpen) {
    if (!afterBubble || !corrections || !corrections.length) return null;
    const wrap = document.createElement('div');
    wrap.className = 'corr-wrap';
    const body = document.createElement('div');
    corrections.forEach(c => {
      const card = document.createElement('div');
      card.className = 'corr-card';
      card.innerHTML = `${c.quote ? `<div class="corr-quote">${esc(c.quote)}</div>` : ''}
        <div class="corr-fixed"><button class="mini-speak" title="Listen">🔊</button>
          <span>${targetSpan(c.corrected)}</span>
          ${c.corrected_roman && !needsRuby(lang) ? `<span class="ni-rom">${esc(c.corrected_roman)}</span>` : ''}</div>
        ${c.construction ? `<div class="corr-form">📐 ${esc(c.construction)}</div>` : ''}
        ${c.explanation ? `<div class="corr-why">${esc(c.explanation)}</div>` : ''}`;
      card.querySelector('.mini-speak').onclick = () => playTTS(cleanForTTS(c.corrected, lang), lang);
      body.appendChild(card);
    });
    wrap.appendChild(collapsible('✏️ Correction' + (corrections.length > 1 ? 's' : ''),
                                 corrections.length, body, startOpen));
    afterBubble.insertAdjacentElement('afterend', wrap);
    return wrap;
  }

  function appendMessage(m, animate = true, target = null) {
    const parent = target || document.getElementById('thread');
    const b = document.createElement('div');
    if (m.role === 'user') {
      b.className = 'bubble user';
      b.textContent = m.text || '';
      parent.appendChild(b);
      scrollThread();
      return b;
    }
    if (m.role === 'system') {
      b.className = 'bubble system';
      b.textContent = m.text || '';
      parent.appendChild(b);
      scrollThread();
      return b;
    }
    // Tutor bubble: reply + per-line tools + collapsible corrections/new items.
    b.className = 'bubble tutor';
    b._gloss = m.gloss || {};
    b._ruby = rubyDefault;
    const reply = m.reply || '';
    const replyEn = (m.reply_en || '').trim();
    // A blank reply (a failed/empty model response, incl. older persisted drills)
    // would otherwise render as an empty bubble — show a clear placeholder instead.
    const replyHtml = reply.trim()
      ? rbSpan(reply, true)
      : '<span class="bubble-empty">⚠️ This didn’t load — please try again.</span>';
    b.innerHTML = `<div class="bubble-reply">${replyHtml}</div>
      ${replyEn ? `<div class="bubble-en" style="display:none">${esc(replyEn)}</div>` : ''}`;

    const items = m.new_items || [];
    const drillSkill = (m.drill || '').trim();

    const tools = document.createElement('div');
    tools.className = 'bubble-tools';
    tools.innerHTML = `<button class="tool-btn speak" title="Listen">🔊</button>
      ${replyEn ? `<button class="tool-btn en" title="Show English">Aa</button>` : ''}
      ${needsRuby(lang) ? `<button class="tool-btn rb-toggle${b._ruby ? '' : ' rom-toggle-off'}" title="Toggle romanization">あ</button>` : ''}
      ${drillSkill ? `<button class="drill-btn" title="Practice this pattern">🎯 Drill: ${esc(drillSkill)}</button>` : ''}`;
    b.appendChild(tools);

    tools.querySelector('.speak').onclick = () => playTTS(cleanForTTS(reply, lang), lang);
    const enToggle = tools.querySelector('.en');
    if (enToggle) {
      enToggle.onclick = () => {
        const enDiv = b.querySelector('.bubble-en');
        const showing = enDiv.style.display !== 'none';
        enDiv.style.display = showing ? 'none' : '';
        enToggle.classList.toggle('on', !showing);
      };
    }
    const rbToggle = tools.querySelector('.rb-toggle');
    if (rbToggle) {
      rbToggle.onclick = () => {
        b._ruby = !b._ruby;
        rubyDefault = b._ruby;                       // remember for new bubbles
        localStorage.setItem('tutor_ruby_inline', b._ruby ? '1' : '0');
        rbToggle.classList.toggle('rom-toggle-off', !b._ruby);
        paintRuby(b);
      };
    }
    const drill = tools.querySelector('.drill-btn');
    if (drill) drill.onclick = () => { if (!sending) startDrill(drillSkill, drill); };

    if (items.length) {
      const list = document.createElement('div');
      list.className = 'ni-list';
      items.forEach(it => list.appendChild(newItemChip(it)));
      b.appendChild(collapsible('💡 New words', items.length, list, animate));
    }

    parent.appendChild(b);
    scrollThread();
    return b;
  }

  function newItemChip(it) {
    const chip = document.createElement('div');
    chip.className = 'ni-chip';
    chip.dataset.word = it.target_text;
    chip.innerHTML = `<button class="mini-speak" title="Listen">🔊</button>
      <div style="flex:1;min-width:0">
        <span class="ni-word">${targetSpan(it.target_text)}</span>
        ${it.romanization && !needsRuby(lang) ? ` <span class="ni-rom">${esc(it.romanization)}</span>` : ''}
        <div class="ni-gloss">${esc(it.english)}</div>
        ${it.notes ? `<div class="ni-notes">${esc(it.notes)}</div>` : ''}
      </div>`;
    chip.querySelector('.mini-speak').onclick = () => playTTS(it.target_text, lang);
    const btn = document.createElement('button');
    btn.className = 'ni-add'; btn.type = 'button'; btn.textContent = '＋ Add';
    btn.onclick = async () => {
      btn.disabled = true; btn.textContent = '…';
      try {
        const res = await fetch('/api/cards', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            source_text: it.english, target_text: it.target_text,
            romanization: it.romanization || '', target_lang: lang,
            notes: it.notes || 'From tutor chat', priority: 3,
          }),
        });
        if (!res.ok) throw new Error();
        btn.outerHTML = '<span class="ni-in-deck">✓ Added</span>';
      } catch { btn.disabled = false; btn.textContent = '＋ Add'; }
    };
    chip.appendChild(btn);
    const x = document.createElement('button');
    x.className = 'ni-x'; x.type = 'button'; x.title = 'Dismiss'; x.textContent = '✕';
    x.onclick = () => {
      const group = chip.closest('.xtra');
      chip.remove();
      if (group && !group.querySelector('.ni-chip')) group.remove();
    };
    chip.appendChild(x);
    return chip;
  }

  // Replace Add buttons with "In deck" for words already saved — ONE status
  // call per render (was one per message).
  async function markInDeck(container) {
    const chips = [...container.querySelectorAll('.ni-chip')].filter(c => c.querySelector('.ni-add'));
    if (!chips.length) return;
    const words = [...new Set(chips.map(c => c.dataset.word))];
    try {
      const res = await fetch('/api/cards/status', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ words, lang }),
      });
      const statuses = (await res.json()).statuses || {};
      chips.forEach(chip => {
        if (statuses[chip.dataset.word]) {
          const btn = chip.querySelector('.ni-add');
          if (btn) btn.outerHTML = '<span class="ni-in-deck">✓ In deck</span>';
        }
      });
    } catch {}
  }

  function showPointsToast(awards) {
    if (!awards || !awards.length) return;
    const total = awards.reduce((n, p) => n + (p.points || 0), 0);
    const what = awards.map(p => p.concept).filter(Boolean).join(', ');
    const toast = document.getElementById('pt-toast');
    toast.innerHTML = `+${total} <svg style="display:inline-block;vertical-align:-0.15em" viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path fill="#f0b429" d="M10 1l2.2 6.8H19l-5.6 4.1 2.1 6.6L10 14.4l-5.5 4.1 2.1-6.6L1 7.8h6.8z"/></svg>${what ? ' — ' + what : ''}`;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2600);
  }

  // ── Sending ──────────────────────────────────────────────────────────────────
  const input = document.getElementById('composer-input');
  const sendBtn = document.getElementById('composer-send');

  // Cap the textarea relative to the *visible* viewport so it shrinks when the
  // keyboard is up (otherwise a tall box eats the whole area above the keyboard).
  function composerMax() {
    const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 600;
    return Math.max(54, Math.min(110, Math.round(vh * 0.22)));
  }
  function growInput() {
    const max = composerMax();
    // Once the box is capped and overflowing, leave the height alone — resetting
    // to `auto` each keystroke momentarily expands the textarea, reflows the
    // composer and resets scrollTop, which reads as the text jumping up/down.
    // We only need to re-measure while the content can still grow the box.
    if (parseFloat(input.style.height) >= max && input.scrollHeight > max) return;
    const prevTop = input.scrollTop;
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, max) + 'px';
    input.scrollTop = prevTop;
  }
  input.addEventListener('input', () => {
    sendBtn.disabled = !input.value.trim() || sending;
    growInput();
  });
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
  sendBtn.onclick = () => send();

  async function send() {
    const text = input.value.trim();
    if (!text || sending) return;
    sending = true;
    sendBtn.disabled = true;
    input.value = ''; input.style.height = 'auto';

    // First message of a fresh chat: clear the welcome bubble, create the conv.
    if (!currentConv) document.getElementById('thread').innerHTML = '';
    // If a drill is in progress, the message is an answer that lives in the panel.
    const drillBody = activeDrill ? activeDrill.body : null;
    const userBubble = appendMessage({ role: 'user', text }, true, drillBody);
    const typing = document.createElement('div');
    typing.className = 'bubble tutor';
    typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    (drillBody || document.getElementById('thread')).appendChild(typing);
    scrollThread();

    try {
      if (!currentConv) {
        const res = await fetch('/api/tutor/conversations', { method: 'POST' });
        if (!res.ok) throw new Error('Could not start a conversation.');
        const conv = await res.json();
        currentConv = conv.id;
        conversations.unshift({ id: conv.id, title: text.slice(0, 60) });
      }
      const convAtSend = currentConv;
      const res = await fetch(`/api/tutor/conversations/${convAtSend}/messages`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) {
        const msg = (await res.json().catch(() => ({}))).detail
          || (res.status === 402 ? 'You\'ve hit your monthly AI limit — add your own Gemini key in Settings.'
            : res.status === 429 ? 'Slow down a little — try again in a minute.'
              : 'The tutor couldn\'t reply — please try again.');
        throw new Error(msg);
      }
      const data = await res.json();
      typing.remove();
      // Only render into the thread if the user hasn't switched chats meanwhile.
      if (currentConv === convAtSend) {
        const b = appendMessage(data.message, true, drillBody);
        const cw = renderCorrections(userBubble, data.message.corrections, true);
        renderRubyAll(cw ? [b, cw] : [b]).then(scrollThread);
        markInDeck(b);
      }
      const gained = (data.message.points || []).reduce((n, p) => n + (p.points || 0), 0);
      if (gained > 0) { showPointsToast(data.message.points); }
      setPoints(data.points_total || 0, gained > 0);
      // Keep the local list in sync: first message becomes the title, and this
      // conversation moves to the top (most recent) with a fresh timestamp.
      const c = conversations.find(x => x.id === convAtSend);
      if (c) {
        if (!c.title) c.title = text.slice(0, 60);
        c.updated_at = new Date().toISOString();
        conversations = [c, ...conversations.filter(x => x.id !== c.id)];
      }
      updateCurrentTitle();
    } catch (e) {
      typing.remove();
      appendMessage({ role: 'system', text: e.message || 'Something went wrong — please try again.' });
    } finally {
      sending = false;
      sendBtn.disabled = !input.value.trim();
      input.focus();
    }
  }

  // ── Drill sub-sessions ─────────────────────────────────────────────────────
  // A drill is a self-contained, collapsible panel. The learner answers in the
  // normal composer (the server routes answers to drill mode while it's active),
  // and ends it with the panel's "End drill" button — after which it collapses.
  function createDrillPanel(skill, drillId, active) {
    const thread = document.getElementById('thread');
    const panel = document.createElement('div');
    panel.className = 'drill-panel' + (active ? '' : ' collapsed');
    panel.dataset.drillId = drillId;
    const head = document.createElement('div');
    head.className = 'drill-head';
    head.innerHTML = `<span class="drill-head-title">🎯 Drill: ${esc(skill || 'practice')}</span>`;
    const endBtn = document.createElement('button');
    endBtn.className = 'drill-end'; endBtn.type = 'button'; endBtn.textContent = 'End drill';
    endBtn.style.display = active ? '' : 'none';
    endBtn.onclick = (e) => { e.stopPropagation(); endDrill(); };
    const chev = document.createElement('span');
    chev.className = 'drill-chev'; chev.textContent = '▾';
    head.appendChild(endBtn); head.appendChild(chev);
    head.onclick = () => panel.classList.toggle('collapsed');
    const body = document.createElement('div');
    body.className = 'drill-body';
    panel.appendChild(head); panel.appendChild(body);
    thread.appendChild(panel);
    return { panel, body, endBtn };
  }

  function setDrillActive(skill, drillId, panel, body) {
    activeDrill = { id: drillId, skill, panel, body };
    input.placeholder = 'Type your translation…';
  }

  function clearDrillUI() {
    activeDrill = null;
    input.placeholder = 'Say something…';
  }

  async function endDrill() {
    if (!activeDrill || !currentConv) return;
    const conv = currentConv, panel = activeDrill.panel;
    const endBtn = panel && panel.querySelector('.drill-end');
    if (endBtn) endBtn.disabled = true;
    try { await fetch(`/api/tutor/conversations/${conv}/drill/end`, { method: 'POST' }); } catch {}
    if (panel) {
      panel.classList.add('collapsed');
      if (endBtn) endBtn.style.display = 'none';
    }
    clearDrillUI();
    input.focus();
  }

  // The tutor offered a generalizable pattern — begin a drill panel. The opening
  // question is the first bubble inside the panel; the learner just answers it.
  async function startDrill(skill, btn) {
    if (!skill || !currentConv || sending || activeDrill) return;
    sending = true;
    sendBtn.disabled = true;
    if (btn) { btn.disabled = true; btn.textContent = '🎯 …'; }
    const typing = document.createElement('div');
    typing.className = 'bubble tutor';
    typing.innerHTML = '<span class="typing"><span></span><span></span><span></span></span>';
    document.getElementById('thread').appendChild(typing);
    scrollThread();
    const convAtSend = currentConv;
    try {
      const res = await fetch(`/api/tutor/conversations/${convAtSend}/drill`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ skill }),
      });
      if (!res.ok) {
        const msg = (await res.json().catch(() => ({}))).detail
          || (res.status === 402 ? 'You\'ve hit your monthly AI limit — add your own Gemini key in Settings.'
            : res.status === 429 ? 'Slow down a little — try again in a minute.'
              : 'Couldn\'t start the drill — please try again.');
        throw new Error(msg);
      }
      const data = await res.json();
      // Defensive: a blank opener would render as an empty, confusing panel — treat
      // it as a failure (the backend already guards this, but never show a void).
      if (!((data.message && data.message.reply) || '').trim()) {
        throw new Error('The tutor couldn’t start the drill — please try again.');
      }
      typing.remove();
      if (btn) btn.remove();          // consumed — one drill per offer
      if (currentConv === convAtSend) {
        const { panel, body } = createDrillPanel(data.skill || skill, data.drill_id, true);
        setDrillActive(data.skill || skill, data.drill_id, panel, body);
        const b = appendMessage(data.message, true, body);
        renderRubyAll([b]).then(scrollThread);
        input.focus();
      }
    } catch (e) {
      typing.remove();
      if (btn) { btn.disabled = false; btn.textContent = '🎯 Drill: ' + skill; }
      appendMessage({ role: 'system', text: e.message || 'Something went wrong — please try again.' });
    } finally {
      sending = false;
      sendBtn.disabled = !input.value.trim();
    }
  }

  // ── Keyboard / viewport fit (mobile) ─────────────────────────────────────────
  // iOS doesn't shrink the layout viewport when the keyboard opens, so the chat
  // column would stay full-height and the composer would sit BELOW the keyboard.
  // The body is position:fixed (see CSS); we size it to the *visible* viewport so
  // the whole chat compresses above the keyboard. Crucially we also follow
  // visualViewport.offsetTop: when iOS scrolls the layout viewport to reveal the
  // focused input, a fixed body pinned at top:0 would get dragged off-screen (the
  // composer "shoots to the top"). Tracking offsetTop moves the body WITH the
  // visible area — following iOS rather than scrollTo-fighting it (no flash). This
  // is the MDN visualViewport pattern, using `top` (not transform) so position:
  // fixed descendants — the drawer, tooltip, toast — keep their viewport anchoring.
  (function () {
    const vv = window.visualViewport;
    if (!vv) return;
    const fit = () => {
      if (vv.scale && Math.abs(vv.scale - 1) > 0.05) return;   // ignore pinch-zoom
      document.body.style.height = Math.round(vv.height) + 'px';
      document.body.style.top = Math.round(vv.offsetTop) + 'px';
      // Keyboard up ⇒ the visible viewport is meaningfully shorter than the
      // layout viewport. Drop the home-indicator safe-area padding then.
      const kbOpen = (window.innerHeight - vv.height) > 100;
      document.body.classList.toggle('kb-open', kbOpen);
      growInput();
    };
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
    // When the box is focused the keyboard animates in; re-fit after it settles
    // and keep the latest text in view.
    input.addEventListener('focus', () => {
      setTimeout(() => { fit(); scrollThread(); }, 120);
    });
    fit();

    // Stop iOS's document rubber-band: dragging on the composer (or any
    // non-scroller) otherwise bounces the whole fixed page and reveals empty
    // space below the textbox. overscroll-behavior alone doesn't cover this on
    // iOS Safari — we must preventDefault touchmove everywhere EXCEPT real
    // scrollers (the thread / chats list) and the composer when it actually
    // overflows (so a long draft can still be scrolled).
    document.addEventListener('touchmove', e => {
      const t = e.target;
      if (t.closest && t.closest('.thread, .chats-list')) return;
      const ce = t.closest && t.closest('#composer-input');
      if (ce && ce.scrollHeight > ce.clientHeight + 1) return;
      e.preventDefault();
    }, { passive: false });
  })();

  // ── Gloss tooltip (shared mechanism with learn.html) ─────────────────────────
  (function () {
    const tip = document.getElementById('gl-tip');
    let _visible = false;
    function showTip(el) {
      const gloss = el.dataset.gloss;
      if (!gloss) { hideTip(); return; }
      tip.textContent = gloss;
      tip.style.maxWidth = Math.min(220, window.innerWidth - 16) + 'px';
      tip.style.display = 'block';
      _visible = true;
      const r = el.getBoundingClientRect();
      const tw = tip.offsetWidth, th = tip.offsetHeight;
      const left = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, window.innerWidth - tw - 8));
      const top = (r.bottom + th + 8 > window.innerHeight && r.top - th - 5 > 0) ? r.top - th - 5 : r.bottom + 5;
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    }
    function hideTip() { if (_visible) { tip.style.display = 'none'; _visible = false; } }
    document.addEventListener('mouseover', e => {
      const gl = e.target.closest && e.target.closest('.gl[data-gloss]');
      gl ? showTip(gl) : hideTip();
    });
    document.addEventListener('focusin', e => {
      const gl = e.target.closest && e.target.closest('.gl[data-gloss]');
      if (gl) showTip(gl);
    });
    document.addEventListener('focusout', hideTip);
    document.addEventListener('scroll', hideTip, { passive: true, capture: true });
  })();

  // ── Nav helpers ──────────────────────────────────────────────────────────────
  function toggleMobileMenu() { document.getElementById('nav-dropdown').classList.toggle('open'); }
  document.addEventListener('click', e => {
    const dd = document.getElementById('nav-dropdown');
    if (dd && dd.classList.contains('open') && !e.target.closest('header')) dd.classList.remove('open');
  });
  async function loadStreak() {
    try {
      const { streak, points } = await fetch('/api/streak').then(r => r.json());
      const parts = [];
      const _flame = `<svg style="display:inline-block;vertical-align:-0.15em" viewBox="0 0 16 20" width="13" height="16" aria-hidden="true"><path fill="#f4702a" d="M8 0C5.5 3.5 3 6.5 3 10.5a5 5 0 0010 0c0-2-.9-3.8-1.8-4.8-.4 1.6-1.1 2.6-2 2.2.4-2.5.2-5.2-1.2-7.9z"/></svg>`;
      const _star  = `<svg style="display:inline-block;vertical-align:-0.15em" viewBox="0 0 20 20" width="13" height="13" aria-hidden="true"><path fill="#f0b429" d="M10 1l2.2 6.8H19l-5.6 4.1 2.1 6.6L10 14.4l-5.5 4.1 2.1-6.6L1 7.8h6.8z"/></svg>`;
      if (streak > 0) parts.push(`${_flame} ${streak}`);
      if (points > 0) parts.push(`${_star} ${points}`);
      if (parts.length) {
        document.querySelectorAll('.streak-display').forEach(el => {
          el.innerHTML = parts.join('<span style="opacity:0.4;margin:0 4px">·</span>');
          el.style.display = '';
        });
      }
    } catch {}
  }
  async function doLogout() {
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login';
  }

  init();
</script>
</body>
</html>
