<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f5f4ef">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Browse</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/label-picker.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Sans+Devanagari:wght@400;500&family=Noto+Sans+Telugu:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Sans+Bengali:wght@400;500&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Sans+Thai:wght@400;500&family=Noto+Sans+Hebrew:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/pages/browse.css">
</head>
<body>

<header>{{NAV}}</header>

<main class="browse-page">
  <div class="browse-tabs" id="browse-tabs">
    <button class="browse-tab active" data-tab="cards" onclick="switchTab('cards')">My Cards</button>
    <button class="browse-tab" data-tab="decks" onclick="switchTab('decks')">My Decks</button>
    <button class="browse-tab" data-tab="labels" onclick="switchTab('labels')">Labels</button>
    <button class="browse-tab" data-tab="community" onclick="switchTab('community')">Community</button>
  </div>

  <!-- My cards -->
  <div id="cards-view">
    <div class="cards-toolbar">
      <input type="text" id="cards-search" placeholder="Search cards…" oninput="filterCards()">
    </div>
    <div class="cards-filters" id="cards-filters">
      <div class="filter-group">
        <span class="filter-label">Lang</span>
        <select id="cards-lang-filter" onchange="filterCards()"></select>
      </div>
      <div class="filter-group">
        <span class="filter-label">Label</span>
        <select id="cards-label-filter" onchange="filterCards()">
          <option value="">All</option>
        </select>
      </div>
      <span class="filter-sep"></span>
      <div class="filter-group">
        <span class="filter-label">CEFR</span>
        <div class="filter-chips" id="cefr-chips">
          <span class="filter-chip" data-val="A1" onclick="toggleChip(this)">A1</span>
          <span class="filter-chip" data-val="A2" onclick="toggleChip(this)">A2</span>
          <span class="filter-chip" data-val="B1" onclick="toggleChip(this)">B1</span>
          <span class="filter-chip" data-val="B2" onclick="toggleChip(this)">B2</span>
          <span class="filter-chip" data-val="C1" onclick="toggleChip(this)">C1</span>
          <span class="filter-chip" data-val="C2" onclick="toggleChip(this)">C2</span>
        </div>
      </div>
      <span class="filter-sep"></span>
      <div class="filter-group">
        <span class="filter-label">Strength</span>
        <div class="filter-chips" id="strength-chips">
          <span class="filter-chip" data-val="new" onclick="toggleChip(this)">New</span>
          <span class="filter-chip" data-val="learning" onclick="toggleChip(this)">Learning</span>
          <span class="filter-chip" data-val="familiar" onclick="toggleChip(this)">Familiar</span>
          <span class="filter-chip" data-val="strong" onclick="toggleChip(this)">Strong</span>
        </div>
      </div>
      <span class="filter-sep"></span>
      <div class="filter-group">
        <span class="filter-label">Status</span>
        <div class="filter-chips" id="status-chips">
          <span class="filter-chip" data-val="active" onclick="toggleChip(this)">Active</span>
          <span class="filter-chip" data-val="suspended" onclick="toggleChip(this)">Suspended</span>
          <span class="filter-chip" data-val="flagged" onclick="toggleChip(this)">Flagged</span>
        </div>
      </div>
      <span class="filter-sep"></span>
      <div class="filter-group">
        <span class="filter-label">Sort</span>
        <select id="cards-sort" onchange="filterCards()">
          <option value="newest">Newest</option>
          <option value="oldest">Oldest</option>
          <option value="priority">Priority</option>
          <option value="alpha">A → Z</option>
          <option value="cefr">CEFR level</option>
          <option value="strength">Strength</option>
        </select>
      </div>
      <button class="filter-clear" onclick="clearFilters()">Clear filters</button>
    </div>
    <div class="cards-count" id="cards-count"></div>
    <div class="card-list-wrap" id="cards-list"></div>
    <button class="cards-load-more" id="cards-load-more" onclick="loadMoreCards()">Load more</button>
  </div>

  <!-- My decks -->
  <div id="my-decks-view" style="display:none">
    <div class="deck-list" id="my-deck-list"></div>
  </div>

  <!-- Labels -->
  <div id="labels-view" style="display:none">
    <div id="merge-suggestions"></div>
    <div class="labels-create-row">
      <input type="text" id="new-label-name" placeholder="New label name…" maxlength="50" onkeydown="if(event.key==='Enter')createNewLabel()">
      <button class="create-btn" onclick="createNewLabel()">Add</button>
    </div>
    <div class="labels-create-row" style="margin-bottom:10px">
      <input type="text" id="label-search" placeholder="Search labels…" oninput="filterLabels()">
    </div>
    <div id="labels-list"></div>
  </div>

  <!-- Community decks -->
  <div id="community-decks-view" style="display:none">
    <div class="comm-filters">
      <input id="deck-search" placeholder="Search decks…" oninput="searchCommunity()">
      <select id="comm-deck-lang" class="settings-select" onchange="loadCommunityDecks()"></select>
      <select id="comm-deck-sort" class="settings-select" onchange="loadCommunityDecks()">
        <option value="">Newest</option>
        <option value="rating">Top rated</option>
        <option value="popular">Most imported</option>
      </select>
    </div>
    <div class="deck-list" id="community-deck-list"></div>
  </div>

  <!-- Deck detail -->
  <div id="deck-detail-view" style="display:none">
    <div class="deck-detail" id="deck-detail"></div>
  </div>
</main>

<div class="selection-bar hidden" id="selection-bar">
  <span class="sel-count" id="sel-count">0 selected</span>
  <button class="sel-all-btn" onclick="selectAllFiltered()">Select loaded</button>
  <button class="sel-action" onclick="showCreateDeckModal()">Create deck</button>
  <button class="sel-clear" onclick="clearSelection()">Clear</button>
</div>

<div class="deck-modal-overlay" id="deck-modal" style="display:none" onclick="if(event.target===this)closeDeckModal()">
  <div class="deck-modal">
    <h3>Create a shared deck</h3>
    <div>
      <div class="create-form-label">Deck name</div>
      <input id="deck-name" placeholder="e.g. HKDSE Core Vocabulary">
    </div>
    <div>
      <div class="create-form-label">Description</div>
      <textarea id="deck-desc" rows="2" placeholder="What's in this deck?"></textarea>
    </div>
    <div>
      <div class="create-form-label">Visibility</div>
      <select id="deck-visibility" class="settings-select">
        <option value="public">Public</option>
        <option value="friends">Friends only</option>
        <option value="private">Private</option>
      </select>
    </div>
    <div class="deck-modal-actions">
      <button class="cancel-btn" onclick="closeDeckModal()">Cancel</button>
      <button class="create-btn" id="create-btn" onclick="createDeck()">Create deck</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/static/pages/browse.js"></script>
</body>
</html>
