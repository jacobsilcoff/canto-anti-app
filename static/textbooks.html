<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script>(function(){var t=localStorage.getItem('theme')||'auto';if(t==='auto')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t;})();</script>
  <meta name="theme-color" content="#f5f4ef">
  <script src="/static/theme.js" defer></script>
  <title>{{APP_NAME}} — Textbooks</title>
  <link rel="icon" href="/static/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500&family=Noto+Sans+KR:wght@400;500&family=Noto+Sans+JP:wght@400;500&family=Noto+Naskh+Arabic:wght@400;500&family=Noto+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/pages/textbooks.css">
</head>
<body>

<header>{{NAV}}</header>

<main class="tb-page" id="library-view">
  <div class="tb-head">
    <div>
      <h1>Textbooks</h1>
      <p>Upload a PDF, read it by chapter, and turn chapters into decks or lessons.</p>
    </div>
  </div>
  <div id="tb-body"><div class="tb-empty"><span class="spinner"></span></div></div>
</main>

<!-- Reader -->
<div class="tbr" id="reader">
  <div class="tbr-top">
    <button class="tbr-icon" onclick="closeReader()" aria-label="Back">‹</button>
    <span class="tbr-title" id="tbr-title"></span>
    <button class="tbr-icon" id="tbr-contents" onclick="openChapters(_rb && _rb.id, true)" title="Chapters" aria-label="Chapters">☰</button>
    <button class="tbr-icon" id="tbr-splitedit" onclick="toggleSplitEdit()" title="Edit the unit split on this page" aria-label="Edit unit split">✂︎</button>
    <button class="tbr-icon" id="tbr-bookmark" onclick="toggleBookmark()" title="Bookmark this page">☆</button>
    <button class="tbr-icon" id="tbr-texttoggle" onclick="toggleTextPane()" title="Show extracted text">Aa</button>
  </div>
  <div class="tbr-chapcap" id="tbr-chapcap"></div>
  <div class="tbr-note" id="tbr-note" style="display:none"></div>
  <div class="tbr-actions">
    <button onclick="readerBuildVocab()">📇 Build vocab deck (this chapter)</button>
    <button id="tbr-lessons-btn" onclick="readerCreateLessons()">📘 Turn chapter into lessons</button>
  </div>
  <div class="tbr-stage">
    <div class="tbr-imgwrap" id="tbr-imgwrap"></div>
    <div class="tbr-textpane"><div class="tbr-textpane-inner" id="tbr-text"></div></div>
  </div>
  <div class="tbr-splitbar" id="tbr-splitbar" style="display:none">
    <div class="tbr-splitbar-msg" id="tbr-splitbar-msg"></div>
    <label class="tbr-splitbar-name" id="tbr-splitbar-name" style="display:none">
      New unit name
      <input type="text" id="tbr-sb-title" maxlength="120" oninput="renameSplitUnit(this.value)"
             placeholder="Name this unit">
    </label>
    <div class="tbr-splitbar-btns">
      <button class="tbr-sb-ghost" onclick="cancelSplitEdit()">Cancel</button>
      <button class="tbr-sb-danger" id="tbr-sb-remove" onclick="removeSplitHere()">Remove split</button>
      <button class="tbr-sb-go" id="tbr-sb-save" onclick="saveSplitEdit()">Save split</button>
    </div>
  </div>
  <div class="tbr-nav">
    <button id="tbr-prev" onclick="turnPage(-1)">‹ Prev</button>
    <span class="tbr-pageno" id="tbr-pageno"></span>
    <button id="tbr-next" onclick="turnPage(1)">Next ›</button>
  </div>
</div>

<!-- Generic modal (upload / vocab / rename) -->
<div class="tb-modal" id="tb-modal" onclick="if(event.target===this)closeModal()">
  <div class="tb-sheet" id="tb-sheet"></div>
</div>

<input type="file" id="tb-file" accept="application/pdf" style="display:none">

<script src="/static/pages/textbooks.js"></script>

</body>
</html>
