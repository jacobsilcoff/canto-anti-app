name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Write .env to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set_if_missing() {
              local key=$1 val=$2
              grep -q "^${key}=" ~/canto-anti-app/.env 2>/dev/null || echo "${key}=${val}" >> ~/canto-anti-app/.env
            }
            touch ~/canto-anti-app/.env
            # Always overwrite the Gemini key so key rotations (e.g. moving to a
            # billed/higher-tier project) actually take effect — set_if_missing
            # would leave the VM pinned to whatever key was first deployed.
            sed -i '/^GEMINI_API_KEY=/d' ~/canto-anti-app/.env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> ~/canto-anti-app/.env
            set_if_missing APP_PASSWORD "${{ secrets.APP_PASSWORD }}"
            set_if_missing APP_ADMIN_USERNAME "${{ secrets.APP_ADMIN_USERNAME }}"
            set_if_missing APP_ADMIN_EMAIL "${{ secrets.APP_ADMIN_EMAIL }}"
            set_if_missing DB_PATH "data/cards.db"
            # Always overwrite domain + email config so secret changes take effect immediately.
            sed -i '/^DOMAIN=/d' ~/canto-anti-app/.env
            echo "DOMAIN=${{ secrets.DOMAIN }}" >> ~/canto-anti-app/.env
            sed -i '/^DEV_DOMAIN=/d' ~/canto-anti-app/.env
            echo "DEV_DOMAIN=${{ secrets.DEV_DOMAIN }}" >> ~/canto-anti-app/.env
            sed -i '/^RESEND_API_KEY=/d' ~/canto-anti-app/.env
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> ~/canto-anti-app/.env
            sed -i '/^FROM_EMAIL=/d' ~/canto-anti-app/.env
            echo "FROM_EMAIL=${{ secrets.FROM_EMAIL }}" >> ~/canto-anti-app/.env
            sed -i '/^APP_URL=/d' ~/canto-anti-app/.env
            echo "APP_URL=https://${{ secrets.DOMAIN }}" >> ~/canto-anti-app/.env
            # Always overwrite Stripe config so key/secret/price rotations take effect.
            sed -i '/^STRIPE_SECRET_KEY=/d' ~/canto-anti-app/.env
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}" >> ~/canto-anti-app/.env
            sed -i '/^STRIPE_WEBHOOK_SECRET=/d' ~/canto-anti-app/.env
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}" >> ~/canto-anti-app/.env
            sed -i '/^STRIPE_PRICE_PRO=/d' ~/canto-anti-app/.env
            echo "STRIPE_PRICE_PRO=${{ secrets.STRIPE_PRICE_PRO }}" >> ~/canto-anti-app/.env
            # Always overwrite Facebook/Meta config so app-id/secret rotations take effect.
            sed -i '/^FACEBOOK_APP_ID=/d' ~/canto-anti-app/.env
            echo "FACEBOOK_APP_ID=${{ secrets.FACEBOOK_APP_ID }}" >> ~/canto-anti-app/.env
            sed -i '/^FACEBOOK_APP_SECRET=/d' ~/canto-anti-app/.env
            echo "FACEBOOK_APP_SECRET=${{ secrets.FACEBOOK_APP_SECRET }}" >> ~/canto-anti-app/.env
            # Always overwrite Turnstile (signup CAPTCHA) config so key rotations take effect.
            sed -i '/^TURNSTILE_SITE_KEY=/d' ~/canto-anti-app/.env
            echo "TURNSTILE_SITE_KEY=${{ secrets.TURNSTILE_SITE_KEY }}" >> ~/canto-anti-app/.env
            sed -i '/^TURNSTILE_SECRET_KEY=/d' ~/canto-anti-app/.env
            echo "TURNSTILE_SECRET_KEY=${{ secrets.TURNSTILE_SECRET_KEY }}" >> ~/canto-anti-app/.env
            # Generate the at-rest encryption key once. NEVER regenerate it —
            # doing so would make every stored user API key undecryptable.
            grep -q '^API_KEY_ENC_KEY=' ~/canto-anti-app/.env || \
              echo "API_KEY_ENC_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> ~/canto-anti-app/.env

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/canto-anti-app
            # Back up the live DB before pulling — migrations run on startup.
            mkdir -p ~/db-backups
            docker cp canto-app:/data/cards.db ~/db-backups/cards-$(date +%F-%H%M%S).db 2>/dev/null || true
            git pull
            docker rm -f canto-app 2>/dev/null || true
            docker compose up -d --build
