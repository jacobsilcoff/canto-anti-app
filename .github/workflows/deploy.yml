name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Write .env to VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set_if_missing() {
              local key=$1 val=$2
              grep -q "^${key}=" ~/canto-anti-app/.env 2>/dev/null || echo "${key}=${val}" >> ~/canto-anti-app/.env
            }
            touch ~/canto-anti-app/.env
            set_if_missing GEMINI_API_KEY "${{ secrets.GEMINI_API_KEY }}"
            set_if_missing APP_PASSWORD "${{ secrets.APP_PASSWORD }}"
            set_if_missing APP_ADMIN_USERNAME "${{ secrets.APP_ADMIN_USERNAME }}"
            set_if_missing DOMAIN "${{ secrets.DOMAIN }}"
            set_if_missing DEV_DOMAIN "${{ secrets.DEV_DOMAIN }}"
            set_if_missing DB_PATH "data/cards.db"
            set_if_missing RESEND_API_KEY "${{ secrets.RESEND_API_KEY }}"
            set_if_missing FROM_EMAIL "${{ secrets.FROM_EMAIL }}"
            set_if_missing APP_URL "https://${{ secrets.DOMAIN }}"
            # Generate the at-rest encryption key once. NEVER regenerate it —
            # doing so would make every stored user API key undecryptable.
            grep -q '^API_KEY_ENC_KEY=' ~/canto-anti-app/.env || \
              echo "API_KEY_ENC_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> ~/canto-anti-app/.env

      - name: Deploy to Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/canto-anti-app
            # Back up the live DB before pulling — migrations run on startup.
            mkdir -p ~/db-backups
            docker cp canto-app:/data/cards.db ~/db-backups/cards-$(date +%F-%H%M%S).db 2>/dev/null || true
            git pull
            docker compose up -d --build
