name: Deploy (staging)

on:
  push:
    branches: [develop]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Write .env to staging checkout
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set_if_missing() {
              local key=$1 val=$2
              grep -q "^${key}=" ~/canto-anti-app-staging/.env 2>/dev/null || echo "${key}=${val}" >> ~/canto-anti-app-staging/.env
            }
            mkdir -p ~/canto-anti-app-staging
            touch ~/canto-anti-app-staging/.env
            # Reuse the same secrets as prod by default; swap to staging-specific
            # secrets here if you want an isolated Gemini key / admin login.
            set_if_missing GEMINI_API_KEY "${{ secrets.GEMINI_API_KEY }}"
            set_if_missing APP_PASSWORD "${{ secrets.APP_PASSWORD }}"
            set_if_missing APP_ADMIN_USERNAME "${{ secrets.APP_ADMIN_USERNAME }}"
            set_if_missing APP_ADMIN_EMAIL "${{ secrets.APP_ADMIN_EMAIL }}"
            set_if_missing DB_PATH "data/cards.db"
            # Staging-only: create test accounts on startup for testing first-time UX.
            set_if_missing TEST_USERS "1"
            set_if_missing TEST_USER_PASSWORD "test"
            # Always overwrite domain + email config so secret changes take effect immediately.
            sed -i '/^RESEND_API_KEY=/d' ~/canto-anti-app-staging/.env
            echo "RESEND_API_KEY=${{ secrets.RESEND_API_KEY }}" >> ~/canto-anti-app-staging/.env
            sed -i '/^FROM_EMAIL=/d' ~/canto-anti-app-staging/.env
            echo "FROM_EMAIL=${{ secrets.FROM_EMAIL }}" >> ~/canto-anti-app-staging/.env
            sed -i '/^APP_URL=/d' ~/canto-anti-app-staging/.env
            echo "APP_URL=https://${{ secrets.DEV_DOMAIN }}" >> ~/canto-anti-app-staging/.env
            # Stripe test-mode config for staging (falls back to empty = billing disabled).
            sed -i '/^STRIPE_SECRET_KEY=/d' ~/canto-anti-app-staging/.env
            echo "STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY_TEST }}" >> ~/canto-anti-app-staging/.env
            sed -i '/^STRIPE_WEBHOOK_SECRET=/d' ~/canto-anti-app-staging/.env
            echo "STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET_TEST }}" >> ~/canto-anti-app-staging/.env
            sed -i '/^STRIPE_PRICE_PRO=/d' ~/canto-anti-app-staging/.env
            echo "STRIPE_PRICE_PRO=${{ secrets.STRIPE_PRICE_PRO_TEST }}" >> ~/canto-anti-app-staging/.env
            # Generate the at-rest encryption key once. NEVER regenerate it —
            # doing so would make every stored user API key undecryptable.
            grep -q '^API_KEY_ENC_KEY=' ~/canto-anti-app-staging/.env || \
              echo "API_KEY_ENC_KEY=$(openssl rand -base64 32 | tr '+/' '-_')" >> ~/canto-anti-app-staging/.env

      - name: Deploy staging stack to Oracle VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VM_HOST }}
          username: ubuntu
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            cd ~/canto-anti-app-staging
            mkdir -p ~/db-backups
            docker cp canto-app-staging:/data/cards.db ~/db-backups/staging-$(date +%F-%H%M%S).db 2>/dev/null || true
            git fetch origin develop
            git checkout develop
            git pull
            docker rm -f canto-app-staging 2>/dev/null || true
            docker compose -p staging -f docker-compose.staging.yml up -d --build
